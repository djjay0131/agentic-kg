[project]
name = "agentic-kg"
version = "0.1.0"
description = "Agentic Knowledge Graphs for Research Progression"
authors = [
    { name = "DJ Jay" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["knowledge-graph", "research", "agents", "llm", "scientific-discovery"]

dependencies = [
    # denario removed (SM-4): never imported anywhere in the repo, and it
    # transitively hard-pins openai==1.99.9 (via cmbagent-autogen), which
    # conflicts with instructor>=1.14's openai>=2.0 and breaks entity
    # extraction. See llm/features/extraction-dep-pinning.md.
    # Bounded deliberately. ">=5.0.0" alone resolved to driver 6.3.1 against a
    # 5.26 server in this repo's own test runs - it happened to work, but a
    # major-version bump arriving silently on a fresh resolve is exactly the
    # kind of breakage nothing here would catch until runtime. <7.0.0 keeps
    # 6.x (what is actually exercised) and excludes the next major, which must
    # be adopted deliberately.
    "neo4j>=5.0.0,<7.0.0",
    "pydantic>=2.0.0",
    "openai>=2.0",
]

[project.optional-dependencies]
# Kept byte-identical to the `migration` extra in packages/core/pyproject.toml.
# This distribution ships the same agentic_kg package (see
# [tool.hatch.build.targets.wheel] below), so both install paths must be able
# to opt in to the same pins. Re-pin both together.
#
# OPT-IN: not installed by default, so today's install and CI are unaffected.
# Exact commit SHAs, not version specifiers — neither repo is on PyPI,
# agentic-kgis has zero tags, and its version sat at 0.2.0 for 122 commits.
migration = [
    # agentic-kgis PR #39 merge commit (fixed `import kgis` failing without
    # pytest). Ships kg_contracts, kgis, kg_eval.
    "agentic-kgis @ git+https://github.com/djjay0131/agentic-kgis@baf0b67e34bd2e7921b5da4492860f741d165464",
    # agentic-kgcs main @ 14ffd0e8 — merge commit of agentic-kgcs#34
    # (compensation asserts post-application state; ADR-0018). BREAKING, and
    # a superset of #30, whose behaviour note still applies.
    # NOTE: after #30, `orcid` is no longer a default strong namespace —
    # Author entity resolution must pass it explicitly.
    # NOTE: after #34, `Compensator.compensate()` takes a required
    # keyword-only `against_snapshot`, `snapshot_guarded` is gone, and
    # `reversal_data` nests the inverse payload under INVERSE_PAYLOAD_KEY.
    # ADR-0018 also imposes a STORE OBLIGATION this adapter must honour: a
    # compensating ATTACH_ASSERTION is an upsert by `assertion_id`, replacing
    # in place. See packages/core/src/agentic_kg/migration/neo4j/store.py.
    "agentic-kgcs @ git+https://github.com/djjay0131/agentic-kgcs@14ffd0e8fde28f265abd41996ede0291b7bfa931",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "testcontainers[neo4j]",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the `migration` extra — hatchling rejects PEP 508 direct
# references (`name @ git+https://...`) at metadata time unless this is set.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["packages/core/src/agentic_kg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests", "packages/api/tests"]
markers = [
    "e2e: end-to-end tests against live services (requires staging env vars)",
    "slow: tests that take >10 seconds",
    "costly: tests that incur API costs (LLM calls)",
    "integration: integration tests requiring external services (Neo4j, APIs)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
