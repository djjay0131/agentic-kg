[project]
name = "agentic-kg"
version = "0.1.0"
description = "Agentic Knowledge Graphs for Research Progression"
authors = [
    { name = "DJ Jay" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["knowledge-graph", "research", "agents", "llm", "scientific-discovery"]

dependencies = [
    # denario removed (SM-4): never imported anywhere in the repo, and it
    # transitively hard-pins openai==1.99.9 (via cmbagent-autogen), which
    # conflicts with instructor>=1.14's openai>=2.0 and breaks entity
    # extraction. See llm/features/extraction-dep-pinning.md.
    # Bounded deliberately. ">=5.0.0" alone resolved to driver 6.3.1 against a
    # 5.26 server in this repo's own test runs - it happened to work, but a
    # major-version bump arriving silently on a fresh resolve is exactly the
    # kind of breakage nothing here would catch until runtime. <7.0.0 keeps
    # 6.x (what is actually exercised) and excludes the next major, which must
    # be adopted deliberately.
    "neo4j>=5.0.0,<7.0.0",
    "pydantic>=2.0.0",
    "openai>=2.0",
]

[project.optional-dependencies]
# The PINS here must match the `migration` extra in packages/core/pyproject.toml
# exactly. This distribution ships the same agentic_kg package (see
# [tool.hatch.build.targets.wheel] below), so both install paths must opt in to
# the same commits. Re-pin both together; `pin_gate.check()` rejects the two
# files naming different revisions for the same package, and CI runs it.
#
# The surrounding *commentary* is a summary here and the long form in
# packages/core/pyproject.toml, which is where an adopter of the library reads
# it. Only the requirement lines are duplicated.
#
# OPT-IN: not installed by default, so today's install and CI are unaffected.
# Exact commit SHAs, not version specifiers — none of these repos is on PyPI,
# and their version strings are not what CI keys on (see pin_gate.py). The
# three pins must match packages/core/pyproject.toml exactly.
migration = [
    # agentic-kgis @ 285ca1d = tag v0.6.0, kg_contracts CONTRACT_VERSION
    # "2.3.0". Ships kg_contracts, kgis, kg_eval. Changes this repo had to act
    # on:
    #  (a) ADR-0029 (agentic-kgis #59, #66) - `GraphReader.get_assertion` and
    #      `AdapterCapabilities.supports_assertion_lookup`. Implemented by both
    #      canonical read surfaces in migration/neo4j/{reader,store}.py.
    #  (b) ADR-0028 (agentic-kgis #58, #69) - `Assertion.source_candidate_ids`
    #      and `Assertion.superseded_by`. Both live outside the ADR-0021 record
    #      seed, so they ride the adapter's serialized `payload` without
    #      re-minting ids; the RETRACT payload's `superseded_by` transport is
    #      persisted on the retired record.
    #  (c) ADR-0027 (agentic-kgis #51, #55) - `RESTORE_IDENTITY` is the exact
    #      inverse of `REVOKE_IDENTITY` and preserves the creation epoch. It is
    #      the ninth CurationOperationType this adapter applies.
    #  (d) CARRIED FROM 0.3.0 - ADR-0026's revoked-identity assertion shield
    #      (including the in-order create-then-revoke batch tombstone), ADR-0025's
    #      `REVOKE_IDENTITY`, and ADR-0024's `IdentityDisposition`.
    "agentic-kgis @ git+https://github.com/djjay0131/agentic-kgis@285ca1d220e45c73525ad3677fa352b7343d4ef7",
    # agentic-kgcs @ ac51b1a = current `main` after #57-#60. The v2.0.0 tag
    # (e2c24fca) predates #57 and validates CONTRACT_VERSION exactly, so it
    # would reject a 2.3.0 envelope; ac51b1a accepts compatible 2.x minors
    # (ADR-0024) and carries the ADR-0027/ADR-0028 halves. Its version string
    # is still 2.0.0 (releases are a separate upstream PR), which is why the
    # SHA - not the version - is the pin CI verifies from direct_url.json.
    #
    # New at ac51b1a:
    #   - ADR-0028 KGCS half (#58): the planner stamps source_candidate_ids on
    #     ATTACH_ASSERTION and superseded_by on the retired copy; the RETRACT
    #     payload carries `superseded_by` as transport.
    #   - RESTORE_IDENTITY adoption (#54) of agentic-kgis ADR-0027.
    #   - ContractVersionRule accepts compatible kg_contracts minors (#57).
    #   - Durable semantic-audit storage (#51), evidence-rendered adviser
    #     replay (#50), and the semantic-ref rowid guard (#59).
    #
    # Carried forward from earlier pins and still true:
    #   - after #30, `orcid` is no longer a default strong namespace, so Author
    #     entity resolution must pass it explicitly;
    #   - after #34, `Compensator.compensate()` takes a required keyword-only
    #     `against_snapshot`, `snapshot_guarded` is gone, and `reversal_data`
    #     nests the inverse payload under INVERSE_PAYLOAD_KEY. ADR-0018 imposes
    #     a STORE OBLIGATION this adapter honours: a compensating
    #     ATTACH_ASSERTION is an upsert by `assertion_id`, replacing in place.
    #     See packages/core/src/agentic_kg/migration/neo4j/store.py.
    #   - ADR-0022: the identity disposition is derived BEFORE routing, so the
    #     registered-identifier guard in migration/curation/pipeline.py no
    #     longer short-circuits on the identity-gate field.
    #   - `assertion_id` is minted from `record_seed(fact_id, object,
    #     valid_period, evidence_refs, provenance)` - CLOCK-FREE. A true replay
    #     collides onto the record it already minted; the same fact carrying new
    #     evidence mints a new one. DEPLOYMENT PREREQUISITE: a scheduled source
    #     read must set `include_snapshot_in_locator=False` or it mints a fresh
    #     ACTIVE record per run (enforced by migration/ingestion/structured.py).
    #   - `ATTACH_ASSERTION` carries a per-subject `assertion_absent` guard, so a
    #     re-planned replay comes back STALE instead of appending a duplicate.
    "agentic-kgcs @ git+https://github.com/djjay0131/agentic-kgcs@ac51b1a72c93800b6c27eac012878da53ef8bfd0",
    # agentic-kgps @ 24a73c6 = tag v0.5.0. The read-only provenance service
    # (ProvenanceService, ProvenanceRouter, verify/correct, B0/B1/B2 harness,
    # PROV-O export) over the same kg_contracts 2.3.0 records. It needs
    # agentic-kgis>=0.6.0 and is read-only over canonical state (KGPS ADR-0001).
    # Nothing in packages/core imports it yet; the R-3 API read path does.
    "agentic-kgps @ git+https://github.com/djjay0131/agentic-kgps@24a73c6d0c46579338ce05cad4a4225927d70680",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "testcontainers[neo4j]",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the `migration` extra — hatchling rejects PEP 508 direct
# references (`name @ git+https://...`) at metadata time unless this is set.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["packages/core/src/agentic_kg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests", "packages/api/tests"]
markers = [
    "e2e: end-to-end tests against live services (requires staging env vars)",
    "slow: tests that take >10 seconds",
    "costly: tests that incur API costs (LLM calls)",
    "integration: integration tests requiring external services (Neo4j, APIs)",
    "requires_db: e2e tests that need direct Neo4j access; run only where the database is reachable (in-VPC, or locally via an IAP tunnel)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
