[project]
name = "agentic-kg"
version = "0.1.0"
description = "Agentic Knowledge Graphs for Research Progression"
authors = [
    { name = "DJ Jay" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["knowledge-graph", "research", "agents", "llm", "scientific-discovery"]

dependencies = [
    # denario removed (SM-4): never imported anywhere in the repo, and it
    # transitively hard-pins openai==1.99.9 (via cmbagent-autogen), which
    # conflicts with instructor>=1.14's openai>=2.0 and breaks entity
    # extraction. See llm/features/extraction-dep-pinning.md.
    "neo4j>=5.0.0",
    "pydantic>=2.0.0",
    "openai>=2.0",
]

[project.optional-dependencies]
# Kept byte-identical to the `migration` extra in packages/core/pyproject.toml.
# This distribution ships the same agentic_kg package (see
# [tool.hatch.build.targets.wheel] below), so both install paths must be able
# to opt in to the same pins. Re-pin both together.
#
# OPT-IN: not installed by default, so today's install and CI are unaffected.
# Exact commit SHAs, not version specifiers — neither repo is on PyPI,
# agentic-kgis has zero tags, and its version sat at 0.2.0 for 122 commits.
migration = [
    # agentic-kgis PR #39 merge commit (fixed `import kgis` failing without
    # pytest). Ships kg_contracts, kgis, kg_eval.
    "agentic-kgis @ git+https://github.com/djjay0131/agentic-kgis@baf0b67e34bd2e7921b5da4492860f741d165464",
    # agentic-kgcs v1.0.0. >>> RE-PIN POINT <<< bump this single SHA once
    # djjay0131/agentic-kgcs#30 (identity-strength fix) merges.
    "agentic-kgcs @ git+https://github.com/djjay0131/agentic-kgcs@609270e700b6e9b94f5ed0f762ebc1a07a6bce95",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "testcontainers[neo4j]",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the `migration` extra — hatchling rejects PEP 508 direct
# references (`name @ git+https://...`) at metadata time unless this is set.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["packages/core/src/agentic_kg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests", "packages/api/tests"]
markers = [
    "e2e: end-to-end tests against live services (requires staging env vars)",
    "slow: tests that take >10 seconds",
    "costly: tests that incur API costs (LLM calls)",
    "integration: integration tests requiring external services (Neo4j, APIs)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
