# Autonomy policy for the research-progression loop.
#
# Status: every gate is HUMAN. This is the shipped default and a test pins it.
# Changing a mode requires ADR-0011/ADR-0013's evidence (recorded gate agreement
# from decided cycles) and an owner decision. Do not edit this file to "try"
# auto mode in staging: the cycle records this version, so an accidental change
# is auditable, not invisible.
#
# ``promotion`` is the evidence bar the system reports against
# (`agentic-kg autonomy status` / the Research Loop Agreement panel). Meeting it
# never promotes a gate by itself: promotion is a human edit of this file in a
# PR. A non-human mode is refused at runtime while its criteria are absent or
# unmet, so this file cannot grant autonomy without measured agreement.
version: "1"
gates:
  select_problem:
    mode: human
    promotion:
      min_decisions: 20
      min_agreement_lower_bound: 0.90
  approve_proposal:
    mode: human
    promotion:
      min_decisions: 20
      min_agreement_lower_bound: 0.90
  review_evaluation:
    # The write gate: a stricter bar, and an auto decision additionally needs a
    # non-abstaining provenance envelope (never a legacy/unattributed result).
    mode: human
    promotion:
      min_decisions: 30
      min_agreement_lower_bound: 0.95
