# Autonomy policy for the research-progression loop.
#
# Status: every gate is HUMAN. This is the shipped default and a test pins it.
# Changing a mode requires ADR-0010's evidence (adviser/human agreement from the
# P2 review queue) and an owner decision. Do not edit this file to "try" auto
# mode in staging: the cycle records this version, so an accidental change is
# auditable, not invisible.
version: "1"
gates:
  select_problem:
    mode: human
  approve_proposal:
    mode: human
  review_evaluation:
    mode: human
