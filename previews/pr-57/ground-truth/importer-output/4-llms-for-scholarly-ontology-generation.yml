- statement: The dynamic nature of scientific research poses a challenge as LLMs trained on present-day
    data may struggle to accurately classify relationships involving topics that have not yet emerged.
  quoted_text: A third limitation arises from the dynamic nature of scientific research, where disciplines
    are continuously redefined by emerging paradigms and discoveries. Although our current results provide
    valuable insights, LLMs trained on present-day data may struggle to accurately classify relationships
    involving topics that have not yet emerged.
