- statement: Enhancing the performance of lightweight models to reduce computational costs and environmental
    impact when generating ontologies of research areas.
  quoted_text: We are fine-tuning off-the-shelf models like BERT, Mistral, LLaMa 3, Flan T5, Gemma, Phi
    3, and DeepSeek with the aim of enhancing the performance of lightweight models to reduce computational
    costs and environmental impact when generating ontologies of research areas.
