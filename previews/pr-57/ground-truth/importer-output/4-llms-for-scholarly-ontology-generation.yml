  quoted_text: Additionally, we will benchmark our findings against additional state-of-the-art ontology
    generation methods, including rule-based systems and statistical approaches.
  datasets: '[]'
  metrics: '[]'
  baselines: '[]'
- statement: Developing a comprehensive, cross-disciplinary ontology of research topics by expanding analysis
    to cover a variety of scientific domains.
  quoted_text: Ultimately, our goal is to develop a comprehensive, cross-disciplinary ontology of research
    topics. To this end, we plan to expand our analysis to cover a variety of scientific domains, including
    materials science, medicine, and physics.
  datasets: '[]'
  metrics: '[]'
  baselines: '[]'
- statement: Generating and maintaining ontologies of research topics is expensive and time-consuming,
    requiring the involvement of several domain experts over an extended period of time. Current solutions
    struggle to generate large-scale, detailed representations of research topics, leaving the challenge
    far from being fully addressed.
  quoted_text: Nevertheless, generating and maintaining ontologies of research topics is both expensive
    and time-consuming, typically requiring the involvement of several domain experts over an extended
    period of time. Moreover, the ever-increasing volume of literature, with approximately 2.5 million
    new scientific papers published annually, demands continuous updates to ensure that these ontologies
    accurately reflect the latest research developments. Over the past 25 years, Artificial Intelligence
    (AI) researchers have developed several methods for the automated or semi-automated generation of
    such ontologies, with varying degrees of success. Some notable achievements include the semi-automatic
    pipeline for generating OpenAlex Topics and the automatic development of the Computer Science Ontology,
    along with a few other initiatives. However, most of the ontologies in this domain are still manually
    created because current solutions still struggle to generate large-scale, detailed representations
    of research topics. Consequently, this challenge remains far from being fully addressed.
  datasets: '[{"name": "IEEE Thesaurus", "url": null, "available": true, "size": null}]'
  metrics: '[{"name": "F1", "description": "Measures the model''s accuracy in identifying semantic relationships
    between research topics.", "baseline_value": 0.967}]'
  baselines: '[{"name": "Claude 3 Sonnet", "paper_doi": null, "performance": {}}, {"name": "Dolphin-Mistral-7B",
    "paper_doi": null, "performance": {}}]'
- statement: The performance of LLMs in ontology generation is highly dependent on the prompting strategy
    employed, with the two-way variant of Chain-of-Thought (CoT) prompting consistently outperforming
    alternative approaches.
  quoted_text: Our study produced several notable insights. First, many models exhibit strong zero-shot
    reasoning capabilities for this task. Second, the performance of LLMs is highly dependent on the prompting
    strategy employed. In particular, the two-way variant of CoT prompting consistently outperforms alternative
    approaches. In fact, our results show that prompting strategies can lead to substantial performance
    gains, with improvements exceeding 0.2 F1 points in several instances.
  datasets: '[{"name": "IEEE-Rel-1K", "url": null, "available": true, "size": null}]'
  metrics: '[{"name": "F1", "description": "Measures the model''s accuracy in identifying semantic relationships
    between research topics.", "baseline_value": 0.967}]'
  baselines: '[{"name": "Claude 3 Sonnet", "paper_doi": null, "performance": {}}, {"name": "Dolphin-Mistral-7B",
    "paper_doi": null, "performance": {}}]'
- statement: There is a performance gap between full open models and proprietary models in scholarly ontology
    generation, with proprietary models like sonnet and gpt-4 significantly outperforming open models
    such as mixtral.
  quoted_text: Overall, we observe a clear performance gap between full open models and proprietary models.
    For example, sonnet achieves an average F1-Score of 0.967, substantially outperforming mixtral which
    has an average F1-Score of 0.779.
  datasets: '[]'
  metrics: '[]'
  baselines: '[]'
- statement: The varied performance among models with the same base architecture but different fine-tuning
    approaches highlights the critical role of instruction-tuning datasets.
  quoted_text: The varied performance among models with the same base architecture but different fine-tuning
    approaches highlights the critical role of instruction-tuning datasets [77].
  datasets: '[]'
  metrics: '[]'
  baselines: '[]'
- statement: The need to improve logical consistency in LLMs when using two-way validation strategies
    to identify and rectify potential inconsistencies.
  quoted_text: We investigated the two-way validation strategy to identify and rectify potential inconsistencies.
    It draws inspiration from prior research showing that approaches to improve logical consistency can
    enhance the overall performance of LLMs [76]. This approach leverages the inverse relationship between
    broader and narrower, as well as the symmetric nature of the same-as and other relationships [22].
    Conflicting answers suggest inconsistencies that may be addressed using heuristic methods.
  datasets: '[]'
  metrics: '[]'
  baselines: '[]'
- statement: The challenge of designing effective empirical rules to detect and mitigate logical inconsistencies
    in LLMs.
  quoted_text: In order to detect and mitigate logical inconsistencies, we designed a set of empirical
    rules (cyan boxes as referees in both Fig. 1a and 1b). The rules were designed to prioritise the development
    of a hierarchical taxonomy.
  datasets: '[]'
  metrics: '[]'
  baselines: '[]'
- statement: The performance gap between small open models and larger proprietary models remains a challenge,
    even though the two-way strategy has reduced this gap.
  quoted_text: Moreover, the two-way strategy has effectively reduced the performance gap between these
    models and their larger, proprietary counterparts, narrowing the difference to just 0.113 F1 points.
  datasets: '[]'
  metrics: '[{"name": "F1-score", "description": "Measures the model''s accuracy in identifying relationships
