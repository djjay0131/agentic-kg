problems:
- statement: The SCICERO pipeline's extraction modules may introduce noise by capturing irrelevant or
    weakly associated relationships between entities, which can affect the quality of the generated triples.
  quoted_text: To minimize the inclusion of irrelevant or weakly associated relationships, the module
    applies a filtering mechanism to exclude entity pairs that are too distant within the text. Specifically,
    it considers only entity pairs separated by a number of tokens within a predefined window size. This
    approach effectively reduces the likelihood of capturing noisy or spurious relationships between entities,
    ensuring a focus on those with meaningful or direct relevance.
  datasets: '[]'
  metrics: '[]'
  baselines: '[]'
- statement: The SCICERO pipeline's validation modules may discard potentially valid triples due to strict
    adherence to domain and range constraints, leading to information loss.
  quoted_text: During this phase, triples that do not adhere to the semantics of the ontology are discarded.
    For instance, the triple <cskg:textbook_dataset, uses, cskg:spatial_prediction>, where cskg:textbook_dataset
    is a cskg-ont:Material and cskg:spatial_prediction is a cskg-ont:Task, is discarded because the class
    cskg-ont:Material is not in the domain of the property cskg-ont:usesTask.
  datasets: '[]'
  metrics: '[]'
  baselines: '[]'
- statement: The SCICERO pipeline's reliance on support from multiple papers to validate triples may lead
    to the exclusion of less common but potentially valuable information.
  quoted_text: Conversely, triples found in only one or a few papers tend to be more prone to noise. To
    discern between reliable and possibly problematic triples, we introduce the concept of support denoting
    the number of papers associated with a specific triple. However, discarding all uncertain triples
    could lead to significant information loss, since many of these triples may still be valid.
  datasets: '[]'
  metrics: '[]'
  baselines: '[]'
