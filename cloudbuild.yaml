# Google Cloud Build configuration
#
# MANUAL-ONLY. The only automatic deploy path is GitHub Actions
# (`.github/workflows/deploy-master.yml`). This file is the manual escape hatch
# an operator runs by hand:
#
#   # Build and deploy API service
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_SERVICE=api,COMMIT_SHA=$(git rev-parse HEAD)
#
#   # Build specific service with version
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_SERVICE=ui,_VERSION=v1.0.0,COMMIT_SHA=$(git rev-parse HEAD)
#
# LEGACY TRIGGER GUARD. Two global Cloud Build triggers created 2026-02-04
# (`agentic-kg-api-staging`, `agentic-kg-ui-staging`) still fire on pushes and
# run this file. Because this file used the `deploy` subcommand, every fired
# trigger REPLACED the Terraform-owned Cloud Run service spec, silently dropping env
# flags (CANONICAL_API_ENABLED, KGCS_CANONICAL_NAMESPACE, GCP_*), scaling and
# anything else Terraform declares. The triggers are not in Terraform state and
# the CI service account cannot delete them, so the owner deletes them by hand
# (see docs/operations/deploy-runbook.md). Until then this file neutralises them
# from the repo side: when the build was started by a trigger (TRIGGER_NAME is
# non-empty) and `_ALLOW_TRIGGER_DEPLOY` is not "true", every step logs and exits
# 0, so the build finishes SUCCESS in seconds without building or pushing
# anything. Cloud Build has no conditional steps, hence the guard at the top of
# every step below.
#
# Deploys mirror deploy-master.yml: `gcloud run services update` /
# `gcloud run jobs update` with only `--image` and `--update-labels`, so a manual
# deploy also never drops Terraform-owned config (ADR-0006).

substitutions:
  _SERVICE: api  # api, ui, or job
  _VERSION: ''   # Optional version tag (e.g., v1.0.0)
  _REGION: us-central1
  _REPOSITORY: agentic-kg
  # Safety default: never deploy from a trigger. Override only deliberately
  # (e.g. --substitutions=_ALLOW_TRIGGER_DEPLOY=true) and never while the legacy
  # triggers still exist.
  _ALLOW_TRIGGER_DEPLOY: "false"

steps:
  # Trigger guard. The same guard is at the top of every step below: when a
  # trigger started this build and the override is not "true", each step exits 0
  # so the whole build is a fast no-op.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'trigger-guard'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # TRIGGER-GUARD (manual-only unless _ALLOW_TRIGGER_DEPLOY=true)
        if [ -n "$TRIGGER_NAME" ] && [ "$_ALLOW_TRIGGER_DEPLOY" != "true" ]; then
          echo "cloudbuild.yaml is manual-only: build started by trigger '$TRIGGER_NAME'; skipping (override with _ALLOW_TRIGGER_DEPLOY=true)."
          exit 0
        fi
        echo "Manual build detected (no trigger); proceeding."

  # Get API URL for UI build (needed at build time for Next.js)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-api-url'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # TRIGGER-GUARD (manual-only unless _ALLOW_TRIGGER_DEPLOY=true)
        if [ -n "$TRIGGER_NAME" ] && [ "$_ALLOW_TRIGGER_DEPLOY" != "true" ]; then
          echo "cloudbuild.yaml is manual-only: build started by trigger '$TRIGGER_NAME'; skipping (override with _ALLOW_TRIGGER_DEPLOY=true)."
          exit 0
        fi
        if [ "${_SERVICE}" = "ui" ]; then
          echo "Fetching API URL for UI build..."
          API_URL=$(gcloud run services describe agentic-kg-api-staging --region=${_REGION} --format='value(status.url)' 2>/dev/null || echo "")
          echo "API URL found: $${API_URL}"
          echo "$${API_URL}" > /workspace/api_url.txt
          echo "Saved to /workspace/api_url.txt"
        else
          echo "" > /workspace/api_url.txt
        fi

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # TRIGGER-GUARD (manual-only unless _ALLOW_TRIGGER_DEPLOY=true)
        if [ -n "$TRIGGER_NAME" ] && [ "$_ALLOW_TRIGGER_DEPLOY" != "true" ]; then
          echo "cloudbuild.yaml is manual-only: build started by trigger '$TRIGGER_NAME'; skipping (override with _ALLOW_TRIGGER_DEPLOY=true)."
          exit 0
        fi
        API_URL=$(cat /workspace/api_url.txt)
        echo "Read API URL from file: '$${API_URL}'"
        BUILD_ARGS=""
        if [ "${_SERVICE}" = "ui" ] && [ -n "$${API_URL}" ]; then
          BUILD_ARGS="--build-arg NEXT_PUBLIC_API_URL=$${API_URL}"
          echo "Build args for UI: $${BUILD_ARGS}"
        fi
        echo "Running docker build with args: $${BUILD_ARGS}"
        docker build \
          -f docker/Dockerfile.${_SERVICE} \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest \
          $${BUILD_ARGS} \
          .

  # Tag with version if provided
  - name: 'gcr.io/cloud-builders/docker'
    id: 'tag-version'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # TRIGGER-GUARD (manual-only unless _ALLOW_TRIGGER_DEPLOY=true)
        if [ -n "$TRIGGER_NAME" ] && [ "$_ALLOW_TRIGGER_DEPLOY" != "true" ]; then
          echo "cloudbuild.yaml is manual-only: build started by trigger '$TRIGGER_NAME'; skipping (override with _ALLOW_TRIGGER_DEPLOY=true)."
          exit 0
        fi
        if [ -n "${_VERSION}" ]; then
          docker tag \
            ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA \
            ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_VERSION}
        fi

  # Push SHA-tagged image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # TRIGGER-GUARD (manual-only unless _ALLOW_TRIGGER_DEPLOY=true)
        if [ -n "$TRIGGER_NAME" ] && [ "$_ALLOW_TRIGGER_DEPLOY" != "true" ]; then
          echo "cloudbuild.yaml is manual-only: build started by trigger '$TRIGGER_NAME'; skipping (override with _ALLOW_TRIGGER_DEPLOY=true)."
          exit 0
        fi
        docker push \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  # Push latest-tagged image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # TRIGGER-GUARD (manual-only unless _ALLOW_TRIGGER_DEPLOY=true)
        if [ -n "$TRIGGER_NAME" ] && [ "$_ALLOW_TRIGGER_DEPLOY" != "true" ]; then
          echo "cloudbuild.yaml is manual-only: build started by trigger '$TRIGGER_NAME'; skipping (override with _ALLOW_TRIGGER_DEPLOY=true)."
          exit 0
        fi
        docker push \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

  # Push version-tagged image if provided
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-version'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # TRIGGER-GUARD (manual-only unless _ALLOW_TRIGGER_DEPLOY=true)
        if [ -n "$TRIGGER_NAME" ] && [ "$_ALLOW_TRIGGER_DEPLOY" != "true" ]; then
          echo "cloudbuild.yaml is manual-only: build started by trigger '$TRIGGER_NAME'; skipping (override with _ALLOW_TRIGGER_DEPLOY=true)."
          exit 0
        fi
        if [ -n "${_VERSION}" ]; then
          docker push \
            ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_VERSION}
        fi

  # Deploy to staging by rolling ONLY the image + commit label, exactly like
  # deploy-master.yml. `services update` (never `deploy`) and `jobs update` leave
  # env, secrets, scaling, port and IAM to Terraform (ADR-0006).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # TRIGGER-GUARD (manual-only unless _ALLOW_TRIGGER_DEPLOY=true)
        if [ -n "$TRIGGER_NAME" ] && [ "$_ALLOW_TRIGGER_DEPLOY" != "true" ]; then
          echo "cloudbuild.yaml is manual-only: build started by trigger '$TRIGGER_NAME'; skipping (override with _ALLOW_TRIGGER_DEPLOY=true)."
          exit 0
        fi
        IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
        if [ "${_SERVICE}" = "job" ]; then
          # Cloud Run Job — roll the image, stamp the commit label.
          gcloud run jobs update agentic-kg-ingest-staging \
            --image=$${IMAGE} \
            --region=${_REGION} \
            --update-labels=environment=staging,commit=$COMMIT_SHA
        else
          # Cloud Run Service — roll the image, stamp the commit label.
          gcloud run services update agentic-kg-${_SERVICE}-staging \
            --image=$${IMAGE} \
            --region=${_REGION} \
            --update-labels=environment=staging,commit=$COMMIT_SHA
        fi

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
