[project]
name = "agentic-kg-core"
version = "0.1.0"
description = "Core knowledge graph and agent logic for Agentic KG"
requires-python = ">=3.12"

dependencies = [
    # Bounded deliberately. ">=5.0.0" alone resolved to driver 6.3.1 against a
    # 5.26 server in this repo's own test runs - it happened to work, but a
    # major-version bump arriving silently on a fresh resolve is exactly the
    # kind of breakage nothing here would catch until runtime. <7.0.0 keeps
    # 6.x (what is actually exercised) and excludes the next major, which must
    # be adopted deliberately.
    "neo4j>=5.0.0,<7.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    # Data Acquisition
    "httpx>=0.24.0",
    "tenacity>=8.0.0",
    "cachetools>=5.0.0",
    "feedparser>=6.0.0",
    # Extraction
    "PyMuPDF>=1.24.3",  # `pymupdf` module name (no stdout deprecation warning)
    # instructor <1.14 paired with openai 1.99.9 fails to `import instructor`
    # (SM-4). instructor>=1.14 requires openai>=2.0. This is only resolvable
    # because `denario` was removed from this package's deps — denario pulled
    # cmbagent-autogen, which hard-pins openai==1.99.9, making openai>=2.0
    # unsatisfiable and blowing up pip's resolver. denario was never imported by
    # core (verified repo-wide); see SM-4 / extraction-dep-pinning.md.
    "instructor>=1.14",
    "openai>=2.0",
    # Agent workflow
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
# KGIS / KGCS migration path — OPT-IN, see agentic_kg.migration.
#
# Deliberately NOT a default dependency. `pip install ./packages/core` (which
# is exactly what .github/workflows/test.yml does) resolves only the
# dependencies above, so today's install, today's CI and today's runtime
# behaviour are all unchanged by this extra existing.
#
# Both are pinned to an exact commit SHA rather than a version specifier or a
# branch. Neither repo is published to PyPI, agentic-kgis carries zero git
# tags, and its version string sat at 0.2.0 across 122 commits — so a
# specifier like ">=0.2.1" would pin nothing reproducible at all.
migration = [
    # Merge commit on main from agentic-kgis PR #39, which fixed `import kgis`
    # failing when pytest was absent (an unguarded optional import). This is
    # the merge commit, not the branch head and not the PR head.
    # Ships THREE packages: kg_contracts (ports), kgis (ingestion),
    # kg_eval (evaluation).
    "agentic-kgis @ git+https://github.com/djjay0131/agentic-kgis@baf0b67e34bd2e7921b5da4492860f741d165464",
    # agentic-kgcs main @ 14ffd0e8 — the merge commit of agentic-kgcs#34
    # ("compensation asserts post-application state and carries an applicable
    # inverse", ADR-0018). Strictly newer than 4eafa83 (#30) and than tag
    # v1.0.0 (609270e); pinned by SHA because tags are mutable.
    #
    # BEHAVIOUR NOTE for callers: after #30, `orcid` is no longer a default
    # strong namespace, so Author entity resolution must pass it explicitly.
    #
    # BREAKING at #34, all three faces of one defect in the compensation path
    # (which had never been executable against a readable store):
    #   (a) `Compensator.compensate(plan, *, against_snapshot)` — required
    #       keyword-only. The source plan's snapshot guard is rebased onto the
    #       epoch the original plan committed at, instead of being carried
    #       verbatim and therefore always STALE. `CompensationResult
    #       .snapshot_guarded` is REMOVED (it was a constant, not a signal).
    #   (b) the RETRACT->ATTACH inverse is now a full `Assertion`, not a
    #       partial restore record.
    #   (c) `reversal_data` separates the inverse payload from the forward
    #       lineage under `INVERSE_PAYLOAD_KEY` ("inverse_payload").
    #
    # STORE OBLIGATION created by (b), which THIS PACKAGE must satisfy:
    # ADR-0018 Decision 5 — "a compensating ATTACH_ASSERTION is an UPSERT BY
    # assertion_id, never an append ... an adapter MUST replace in place".
    # Replacing in place must not destroy the record's history; see
    # `Neo4jGraphMutationStore._insert_assertion` and the test named
    # test_compensating_attach_upserts_without_rewriting_history.
    #
    # agentic-kgcs depends on agentic-kgis>=0.2.0, satisfied by the git pin
    # above rather than from PyPI.
    "agentic-kgcs @ git+https://github.com/djjay0131/agentic-kgcs@14ffd0e8fde28f265abd41996ede0291b7bfa931",
]

[project.scripts]
agentic-kg = "agentic_kg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the `migration` extra: hatchling refuses direct references
# (PEP 508 `name @ git+https://...`) unless this is set, and it refuses them at
# *metadata* time — so without this the plain `pip install ./packages/core`
# used by CI fails too, not just an install of the extra.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_kg"]
