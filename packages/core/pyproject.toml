[project]
name = "agentic-kg-core"
version = "0.1.0"
description = "Core knowledge graph and agent logic for Agentic KG"
requires-python = ">=3.12"

dependencies = [
    # Bounded deliberately. ">=5.0.0" alone resolved to driver 6.3.1 against a
    # 5.26 server in this repo's own test runs - it happened to work, but a
    # major-version bump arriving silently on a fresh resolve is exactly the
    # kind of breakage nothing here would catch until runtime. <7.0.0 keeps
    # 6.x (what is actually exercised) and excludes the next major, which must
    # be adopted deliberately.
    "neo4j>=5.0.0,<7.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    # Data Acquisition
    "httpx>=0.24.0",
    "tenacity>=8.0.0",
    "cachetools>=5.0.0",
    "feedparser>=6.0.0",
    # Extraction
    "PyMuPDF>=1.24.3",  # `pymupdf` module name (no stdout deprecation warning)
    # instructor <1.14 paired with openai 1.99.9 fails to `import instructor`
    # (SM-4). instructor>=1.14 requires openai>=2.0. This is only resolvable
    # because `denario` was removed from this package's deps — denario pulled
    # cmbagent-autogen, which hard-pins openai==1.99.9, making openai>=2.0
    # unsatisfiable and blowing up pip's resolver. denario was never imported by
    # core (verified repo-wide); see SM-4 / extraction-dep-pinning.md.
    "instructor>=1.14",
    "openai>=2.0",
    # Agent workflow
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "docker>=7.0.0",
    # Cloud Run Job execution backend (GCS hand-off + Run Admin API auth)
    "google-auth>=2.0.0",
    "google-cloud-storage>=2.0.0",
]

[project.optional-dependencies]
# KGIS / KGCS migration path — OPT-IN, see agentic_kg.migration.
#
# Deliberately NOT a default dependency. `pip install ./packages/core` (which
# is exactly what .github/workflows/test.yml does) resolves only the
# dependencies above, so today's install, today's CI and today's runtime
# behaviour are all unchanged by this extra existing.
#
# All three are pinned to an exact commit SHA rather than a version specifier
# or a branch. None of these repos is published to PyPI, their version strings
# have historically lagged source-breaking changes, and agentic-kgis carried
# zero git tags until v0.5.0 — so a specifier would pin nothing reproducible.
# tests/migration/neo4j/pin_gate.py verifies the RESOLVED commit from
# direct_url.json, not the version.
migration = [
    # agentic-kgis @ 285ca1d = tag v0.6.0, kg_contracts CONTRACT_VERSION
    # "2.3.0". Ships THREE packages: kg_contracts (ports), kgis (ingestion),
    # kg_eval (evaluation). Up from d5bab8f6 (0.3.0 / contracts 2.0.0).
    #
    # What this pin changed, and what this package had to do about it:
    #
    # (a) ADR-0029 (agentic-kgis #59, #66): the provenance read ports.
    #     `GraphReader.get_assertion(assertion_id, options)` resolves one
    #     assertion by id under exactly the visibility rules `assertions_for`
    #     applies, and `AdapterCapabilities.supports_assertion_lookup` says
    #     whether it is an index seek. Both canonical surfaces here implement
    #     it; `Neo4jCanonicalGraphReader.iter_assertions` is the batched,
    #     namespace-scoped stream KGPS routing needs. The id index is the
    #     existing `canon_assertion_uid` unique constraint, so no migration is
    #     required.
    #
    # (b) ADR-0028 (agentic-kgis #58, #69): `Assertion.source_candidate_ids`
    #     and `Assertion.superseded_by`. Both are read-only lineage metadata
    #     outside the ADR-0021 record seed, so adding/changing either never
    #     re-mints an assertion id. They ride the adapter's serialized
    #     `payload`, and the RETRACT payload's `superseded_by` transport is
    #     persisted on the retired record (`superseded_by` is a partial
    #     invariant: set => status SUPERSEDED and superseded_at set).
    #
    # (c) ADR-0027 (agentic-kgis #51, #55): `RESTORE_IDENTITY` reverses a
    #     revoke and preserves the creation epoch; the ADR-0026 assertion
    #     shield is subject-only. This adapter applies the new (ninth)
    #     CurationOperationType; `operations.py` enumerates it and `store.py`
    #     appends an ACTIVE status entry without touching the minting epoch.
    #
    # (d) CARRIED FORWARD and still in force: ADR-0026's revoked-identity
    #     assertion shield (including the in-order create-then-revoke batch
    #     tombstone and the loud double-revoke non-commit); ADR-0025's
    #     `REVOKE_IDENTITY`; ADR-0024's `IdentityDisposition` on
    #     `ConfidencePolicy.route()`; ADR-0022's version-provenance fields.
    #     This adapter implements all of these in Cypher; see
    #     migration/neo4j/store.py `_subject_revoked`,
    #     `_apply_revoke_identity`, `_apply_restore_identity`, and the
    #     conformance mutants in
    #     tests/migration/neo4j/test_conformance_is_falsifiable.py.
    "agentic-kgis @ git+https://github.com/djjay0131/agentic-kgis@285ca1d220e45c73525ad3677fa352b7343d4ef7",
    # agentic-kgcs @ ac51b1a = current `main` after #57-#60. Up from e2c24fca
    # (the v2.0.0 tag). The v2.0.0 tag predates #57 and validates
    # CONTRACT_VERSION exactly, so it would reject a 2.3.0 envelope; ac51b1a
    # accepts compatible 2.x minors (ADR-0024). Its version string is still
    # 2.0.0 (releases are a separate upstream PR), which is why the SHA is the
    # pin CI verifies.
    #
    # NEW at ac51b1a:
    #   - ADR-0028 KGCS half (#58): `CurationPlanner` stamps
    #     `source_candidate_ids` on every ATTACH_ASSERTION and
    #     `ConceptEvolutionPlanner.plan_supersession` stamps `superseded_by` on
    #     the retired copy; the RETRACT payload retains the untyped
    #     `superseded_by` as the operation's transport. This adapter persists
    #     that pointer on the record.
    #   - RESTORE_IDENTITY adoption (#54) of agentic-kgis ADR-0027.
    #   - ContractVersionRule now defaults to COMPATIBLE_MINOR (#57).
    #   - Durable semantic-audit storage (#51), evidence-rendered adviser
    #     replay (#50), and the semantic-ref rowid append-only guard (#59).
    #
    # BEHAVIOUR NOTES carried forward and still in force:
    #   - after #30, `orcid` is no longer a default strong namespace, so Author
    #     entity resolution must pass it explicitly;
    #   - after #34, `Compensator.compensate(plan, *, against_snapshot)` is
    #     required keyword-only, `CompensationResult.snapshot_guarded` is gone
    #     (`fully_compensable` survives as a derived property), the
    #     RETRACT->ATTACH inverse is a full `Assertion`, and `reversal_data`
    #     nests the inverse payload under INVERSE_PAYLOAD_KEY.
    #     STORE OBLIGATION from that (ADR-0018 Decision 5): a compensating
    #     ATTACH_ASSERTION is an UPSERT BY assertion_id, replacing in place
    #     without destroying history. See `Neo4jGraphMutationStore
    #     ._insert_assertion` and test_compensating_attach_upserts_without
    #     _rewriting_history.
    #   - ADR-0022 / 727df56 (#44): the identity disposition is derived BEFORE
    #     routing. MEASURED HERE, over the committed 8-paper corpus at published
    #     thresholds: the unmodified contract default routes 8 of 252 AUTO (the
    #     DOI-keyed structured `Paper` identities) and defers 244; it still
    #     reaches NO graded research entity, so the `new` arm remains an honest
    #     null. Consequence acted on: the registered-identifier guard in
    #     migration/curation/pipeline.py no longer short-circuits on the
    #     identity-gate field. See
    #     tests/migration/ingestion/test_adjudication_routing.py and
    #     tests/migration/curation/test_policy.py.
    #
    # CARRIED FORWARD from f68d1d7:
    #   - `assertion_id` is minted from `record_seed(fact_id, object,
    #     valid_period, evidence_refs, provenance)`, which is CLOCK-FREE:
    #     `recorded_at` is deliberately excluded. A true replay therefore
    #     collides onto the record it already minted, while the same fact
    #     citing NEW evidence mints a NEW record. This is the evidence-evolution
    #     fix, asserted BY IDENTITY in tests/migration/neo4j/
    #     test_evidence_evolution.py.
    #   - DEPLOYMENT PREREQUISITE that follows from it. The locator is
    #     `provenance.source_ref`, one of the seed's components, and KGIS's
    #     `StructuredRecordReader` stamps `@snapshot=<version>` into the locator
    #     BY DEFAULT. A source read on a schedule whose provider carries an
    #     explicit snapshot_version (txn id / LSN / watermark) therefore mints a
    #     fresh ACTIVE record every run for unchanged data - measured, 30
    #     re-syncs of one unchanged row produce 30 records instead of 1.
    #     Adopters MUST set `include_snapshot_in_locator=False`. Enforced by
    #     migration/ingestion/structured.py (which refuses the unsafe value) and
    #     by an AST check; operator runbook at
    #     docs/operations/structured-resync-runbook.md.
    #   - `ATTACH_ASSERTION` carries a per-subject `assertion_absent`
    #     precondition, so a re-planned replay comes back
    #     `ExecutionOutcome.STALE` before the store is touched.
    #   - `Compensator._invert`'s legacy `reversal_data` fallback now RAISES by
    #     default (opt in with `allow_legacy_reversal_data=True`), and a
    #     malformed INVERSE_PAYLOAD_KEY raises unconditionally.
    #
    # agentic-kgcs depends on agentic-kgis>=0.5.0, satisfied by the git pin
    # above rather than from PyPI.
    "agentic-kgcs @ git+https://github.com/djjay0131/agentic-kgcs@ac51b1a72c93800b6c27eac012878da53ef8bfd0",
    # agentic-kgps @ 24a73c6 = tag v0.5.0. The read-only provenance service
    # (PA-AKG): ProvenanceService, ProvenanceRouter, verify/correct, the
    # B0/B1/B2 harness, and PROV-O export, over the same kg_contracts 2.3.0
    # records. It requires agentic-kgis>=0.6.0 and never writes canonical state
    # (KGPS ADR-0001). Nothing in packages/core imports it yet; R-3 PR-4 adds
    # the API read path, and the ADR-0004 CI import check asserts it resolves
    # with this extra.
    "agentic-kgps @ git+https://github.com/djjay0131/agentic-kgps@24a73c6d0c46579338ce05cad4a4225927d70680",
]

[project.scripts]
agentic-kg = "agentic_kg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the `migration` extra: hatchling refuses direct references
# (PEP 508 `name @ git+https://...`) unless this is set, and it refuses them at
# *metadata* time — so without this the plain `pip install ./packages/core`
# used by CI fails too, not just an install of the extra.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_kg"]
