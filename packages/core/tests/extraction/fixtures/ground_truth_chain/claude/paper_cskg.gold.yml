notes: >-
  Judgment calls, flagged for reconciliation.

  TOPICS. Restricted to two per the extractor's "smallest number, usually one or
  two" instruction. "Ontology Engineering" and "Entity Linking" were both
  genuinely arguable and dropped: the paper does build a 179-relation domain
  ontology, and does emit 31K owl:sameAs links to DBpedia plus 27K to Wikidata.
  If the importer emits either, I would not call it a false positive.

  MODEL vs TOOL — the main disagreement risk on this paper. The pipeline's four
  components (DyGIEpp, CSO Classifier, OpenIE, PoS Tagger) are all called
  "tools" by the paper. I classed DyGIEpp as a Model (it is a named neural
  IE model with weights, confidence only 0.6) but excluded the CSO Classifier,
  whose mechanism the paper describes as syntactic and semantic similarity
  rather than a learned artifact. OpenIE and PoS tagging I recorded as Methods,
  since the underlying techniques are named recipes even though the paper refers
  to the Stanford implementations. A reviewer could defensibly move any of these
  three between categories.

  MLP EXCLUDED FROM MODELS. "a Multi-Layer Perceptron classifier" is an
  architecture family, not a named artifact with weights — the same rule that
  makes "transformer architecture" not a model. Recorded here because it is a
  likely importer false positive.

  NAMED RESOURCES EXCLUDED. CS-KG, AI-KG, ORKG, Nanopublications, VerbNet,
  WordNet, CSO, MAG, OpenAlex, DBpedia and Wikidata are all named resources
  (knowledge graphs, lexicons, corpora) rather than concepts, models or methods.
  None has a home in the E-8 entity model. I expect the importer to emit several
  of them as concepts or models; whether that counts as a miss is a genuine
  schema question, not a labeling one, and it needs deciding before the diff.

  EXTRACTOR ARTIFACT. The PDF extractor dehyphenates across line breaks, so the
  text says "paraphrasedistilroberta-base-v2". The importer's LLM will see that
  string, so it is listed as an acceptable alias alongside the correct spelling.
  Ligatures (ﬁ, ﬀ) survive extraction and are preserved in the quotes verbatim.

  LOW-CONFIDENCE ENTRIES. "support score" (0.55) and "linked data" (0.6) are the
  weakest concepts — both grounded, both arguably too paper-specific or too
  generic respectively. "majority vote" (0.6) is a real but minor procedure used
  only to build the gold standard.

  SECTION SCOPE. Labeled from abstract + introduction + methods + evaluation
  only, per _EXTRACTOR_WANTED_SECTIONS. Related Work, Statistics, the AI-KG
  comparison and Conclusions were excluded, so entities appearing only there are
  deliberately absent.
