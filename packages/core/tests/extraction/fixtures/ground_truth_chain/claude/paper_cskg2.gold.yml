problems:
  - statement: "The volume of scientific literature grows by roughly 2.5 million articles a year, mostly as hard-to-parse PDFs or unstructured plain text, which outstrips the ability of AI tools to interpret and explore it."
    quoted_text: "a significant challenge remains: processing the vast quantity of scientific papers, which continues to expand at a rate of approximately 2.5 million new articles each year"
    involves_concepts:
      - "scientific knowledge graph"
      - "information extraction pipeline"

  - statement: "LLMs that answer questions about a single paper do not scale to understanding the entities and narratives of a whole research field spanning millions of papers, and retrieval-augmented generation does not close the gap."
    quoted_text: "does not extend to understanding the key entities, narratives, and concepts of a research field represented by millions of such papers"
    involves_concepts:
      - "scientific knowledge graph"

  # The problem that makes this paper the anchor's successor — it critiques
  # cskg directly. Most load-bearing entry for the citation chain.
  - statement: "CS-KG 1.0 carries no time-related information for its entities, includes only papers cited at least once, and is built on the now-discontinued Microsoft Academic Graph, so it cannot be updated or linked to a current metadata catalog."
    quoted_text: "CS-KG lacks time-related information for its entities, which is essential for analyzing trends in the adoption and evolution of various methods and materials"
    involves_concepts:
      - "scientific knowledge graph"
      - "temporal information"

  - statement: "AI-KG covers only 330,000 papers, its entity relationships are semantically shallow, and its scope is confined to artificial intelligence rather than computer science as a whole."
    quoted_text: "its coverage is restricted to 330,000 research papers, the semantic depth of the relationships between entities is relatively shallow, and its scope is confined exclusively to the domain of artificial intelligence"
    involves_concepts:
      - "scientific knowledge graph"

  - statement: "Triples extracted from only one or a few papers are prone to noise, but discarding every low-support triple would throw away a large number of valid statements."
    quoted_text: "However, discarding all uncertain triples could lead to significant information loss, since many of these triples may still be valid"
    involves_concepts:
      - "support"

  - statement: "The link-prediction benchmarks the community relies on hold only tens of thousands of triples, which is too small by current standards to test the scalability of link-prediction methods."
    quoted_text: "usually feature tens of thousands of triples. By current standards, these datasets are considered small"
    involves_concepts:
      - "link prediction"

