notes: >-
  Judgment calls and flags for reconciliation.

  GLUED REFERENCE NUMERALS ARE A NEW EXTRACTION HAZARD ON THIS PAPER. Nature
  uses superscript citations, and the extractor glues them onto the preceding
  token: "SciBERT59", "TransR65", "ComplEx66", "DistMul67", "RESCAL68",
  "CS-KG50", "Dessí et al.52". Every affected entity name carries the glued form
  as an alias. This is worse than cskg's ligature problem, because it hits model
  names rather than prose — if the importer echoes the glued form, a correct
  extraction looks like a miss. Worth checking whether the segmenter can strip
  these before extraction.

  "DistMul" IS THE PAPER'S TYPO. The model is DistMult. Scored canonical is the
  correct name with the paper's spelling as an alias, on the grounds that the
  answer key should not propagate a typo into the graph — but a reviewer could
  reasonably argue the paper's own terminology rule wins here.

  CSO CLASSIFIER IS THE ENTRY MOST LIKELY TO MOVE. Kept as a model at 0.5 purely
  for consistency with cskg's reconciled record. This paper actually weakens the
  case: it describes the classifier as leveraging "two unsupervised components",
  one rule-based with Levenshtein similarity, one using Word2Vec. If we revisit
  the cskg call, revisit both papers together — the whole point of a chain is
  that the same component is labeled the same way twice.

  MODEL COUNT IS HIGH AND THAT IS REAL. Nine models, against three on cskg. The
  paper genuinely names more: it upgrades the validator from an MLP to a
  fine-tuned SciBERT, states DyGIEpp's BERT backbone explicitly (cskg did not),
  uses Word2Vec in two separate modules, and evaluates four link-prediction
  baselines. Only the CSO Classifier is a judgment call.

  SUPPORT CANONICAL DIVERGES FROM cskg ON PURPOSE. This paper says "the concept
  of support"; cskg said both "support" and "support score", and its reconciled
  record chose "support score". Aliases cover both forms in both files so no
  score changes, but the chain should settle on one canonical — this is exactly
  the recurring concept the set was built to watch accumulate, and it should not
  accumulate under two names.

  TOPICS. Two again. "Ontology Engineering" is the same arguable-and-dropped
  call as on cskg (this paper's ontology has 2,275 axioms and 39 predicates
  mapped to 464 verbs), so if the reconciled record puts it in
  acceptable_extras there, do the same here. "Large Language Models" and
  "Retrieval-Augmented Generation" are both legal taxonomy names and both appear
  in the introduction, but only as motivation for why KGs are needed — the paper
  neither builds nor evaluates either. I expect the importer to emit at least
  one of them.

  RAG AND LLMs EXCLUDED AS CONCEPTS for the same reason: SCHEMA.md asks for
  concepts the paper "relies on", and these are cited as insufficient, not
  relied upon. Likely importer false positives, recorded here deliberately.

  NAMED RESOURCES, same open question as cskg and denser here: SCICERO (the
  pipeline's own name), CS-KG, CS-KG 1.0, AI-KG, ORKG, SoftwareKG, SemOpenAlex,
  Nanopublications, OpenAlex, MAG, CSO, VerbNet, WordNet, DBpedia, Wikidata,
  YAGO, BabelNet, Google Knowledge Graph, Stanford Core NLP, SciERC, plus the
  benchmark datasets CSKG-2M, CSKG-490K, CSKG-132K, WN18 and FB15k. None is
  scored. Note that the benchmarks and SciERC are datasets, which the Problem
  schema has a `datasets` field for but the entity model does not — see
  docs/ground-truth/named-resources.md.

  SIX PROBLEMS, TWO OF WHICH ARE ABOUT OTHER RESOURCES. P3 (CS-KG 1.0's
  limitations) and P4 (AI-KG's) are limitations of prior work rather than of the
  field, and a reviewer might argue they are not this paper's problems at all. I
  kept both, and P3 emphatically: it is the direct critique of the chain's
  anchor, so it is the single best test of whether the importer can represent a
  paper superseding its predecessor. If it survives reconciliation it should
  become a targeted assertion in the eval harness.

  WEAKEST ENTRIES: CSO Classifier (0.5, see above); knowledge-centric paradigm
  (0.55 — a framing the paper adopts in one sentence); relation clustering,
  entity filtering and Levenshtein similarity (0.6 — real steps, each stated
  once); BERT (0.6 — named only as DyGIEpp's backbone, and arguably subsumed by
  it); support (0.6 — defined here but not a contribution of this paper).

  SECTION SCOPE: abstract, Background & Summary, Methods, Technical Validation.
  Data Records and Usage Notes are absent from the extracted text, so the
  reified-statement example and the SPARQL/dump access details were not
  available; entities appearing only there are deliberately missing.
