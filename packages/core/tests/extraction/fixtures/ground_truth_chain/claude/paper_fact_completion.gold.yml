cites_within_set: []

notes: >-
  Judgment calls and flags for reconciliation.

  SECTION SCOPE IS DELIBERATE AND GOLD IS RIGHT TO FOLLOW IT. Only the
  abstract, I. Introduction, III. SciCheck and IV. Evaluation are in
  paper_fact_completion.txt. My first pass called this a truncated extract and
  said the review might need redoing; that was wrong. scripts/segment_ground_
  truth.py names all six sections explicitly and keeps only the four that
  ingestion.py's _build_extractor_section_text feeds the extractors
  (abstract / introduction / methods / experiments). Section II (Related Work),
  Section V (Use Case: AI-KG) and Section VI (Conclusion) are excluded on
  purpose, and gold must exclude them too: an entity the importer cannot read
  is a guaranteed recall miss, not a labeling target. Nothing below changes.

  BUT SECTION V WAS AUDITED AGAINST THE PDF, AND IT IS WHERE THIS PAPER'S CHAIN
  LINKS LIVE. This is a finding about the segmenter's section policy, not about
  this file. Section V is 6,502 characters and contains at least five entities
  that recur elsewhere in the citation chain and appear NOWHERE in the
  extractor's input for this paper:

    - "support score" — "the authors adopted a support score deﬁned as the
      number of research papers where the fact was extracted from". This is the
      chain's recurring concept, the one cskg and cskg2 were just reconciled to
      share a single canonical. It occurs zero times in the extractor input.
      The five "support" hits there are the verb "supporting" and the AI-KG
      relation names supportsTask / supportsMethod — not the concept.
    - "TransR" — scored as a model on cskg2; here only in "state-of-the-art
      methods developed for general-domain KGs such as TransE, TransR, RotatE".
    - the CSO topic classifier — "a topic classiﬁer developed on top of the CSO
      ontology"; CSO Classifier is a scored model on both previous papers.
    - verb clustering — "The relations were created by clustering frequent
      verbs"; this is cskg/cskg2's "predicate mapping" and the "relation
      clustering" that cskg2 parked in acceptable_extras.
    - "information extraction pipeline" — a scored concept on both previous
      papers; the exact phrase appears in Section V ("missed by the information
      extraction pipeline") and zero times in the extractor input.

  THE CONSEQUENCE IS SPECIFIC AND IT LANDS ON THE POINT OF THE WHOLE SET. This
  collection exists to watch a concept accumulate evidence across a citation
  chain. On this paper, five of those recurring entities are present in the
  paper and invisible to the importer, purely because of which sections get fed
  to the extractors. When the diff is run, the resulting gap will look like an
  importer recall failure and will actually be a segmentation policy decision.
  Gold cannot fix this — the right fix is upstream, and it is a production
  question, not a fixture one: should a "use case" or "application" section be
  in _build_extractor_section_text's keep-list? On this paper it is the single
  densest source of chain-recurring entities in the document.

  NOW LOGGED AND MEASURED ACROSS ALL EIGHT PAPERS — see
  docs/ground-truth/segmenter-findings.md cause (7), added 2026-08-09. The audit
  found this is not the worst case: keep-list coverage of body text ranges from
  3.9% (kg_construction_survey, abstract + introduction only, 18 of its 22 chain
  entities invisible) to 71.7%, with llm_ontology_gen at 20.6% and losing the
  spine concept "scientific knowledge graph" outright. fact_completion sits at
  69.7% and loses 5, but its losses are the most targeted, because Section V is
  precisely where this paper touches the rest of the chain. If the keep-list
  changes, paper_fact_completion.txt must be regenerated and this review redone
  rather than patched — that caveat was wrong as a description of the current
  fixture, but it becomes correct the moment the policy changes.

  BOTH EXTRACTION HAZARDS APPEAR ON THIS PAPER AT ONCE. cskg had ligatures,
  cskg2 had glued reference numerals, and IEEE Access has both: 104 "ﬁ" and 4
  "ﬂ" ligatures, plus glued footnote markers ("SciCheck6", "model7"). It adds a
  third: five tokens split across line breaks, which whitespace normalisation
  turns into "classi- ﬁer", "Sci- Check" and "AIKG- 500". Quotes here avoid
  those spans, but the importer's LLM will see them, and "Sci- Check" in
  particular could plausibly surface as a mangled entity name. It adds a fourth
  on top: curly quotation marks (U+2019 x8, U+2018 x5), which is what made
  "DeLong's test" fail the verbatim check on the first pass — the quote needed
  "DeLong’s", and the ASCII form is an alias. Three papers, three publishers,
  four distinct artifact classes — the segmenter fix should probably be
  publisher-agnostic Unicode normalisation rather than per-case patching, and
  validate_ground_truth.py catching this is a point in favour of running it on
  reviewer files, not just reconciled ones.

  THE BIGGEST FLAG: THIS PAPER CONTRADICTS cskg2's ALIASING OF LINK PREDICTION.
  cskg2's reconciled record lists "knowledge graph completion" as an alias of
  "link prediction" — reasonable there, since that paper says link prediction
  "is also known as knowledge graph completion". This paper puts them side by
  side as two different techniques in one sentence: incompleteness "is usually
  addressed by link prediction or triple classiﬁcation techniques", with KG
  completion as the umbrella task both serve. I have scored them as separate
  concepts here and deliberately left link prediction's alias list empty. Both
  files cannot be right. Whichever way reconciliation goes, it has to change
  one of the two files, and it matters more than it looks: link prediction is
  a recurring chain concept, and if the two papers disagree about what it is
  an alias of, the accumulation signal is measuring our inconsistency.

  SciCheck AS A METHOD CONTRADICTS SCICERO AS A NAMED RESOURCE. cskg2 parked
  SCICERO — that paper's own named pipeline — in
  acceptable_extras.named_resources, pending the schema decision. I have scored
  SciCheck as a Method here instead, because this paper calls it "a new triple
  classiﬁcation approach" and "a novel approach", and an approach is a recipe.
  I am not confident this is right, only that it is what the paper says. The
  general question reconciliation needs to answer: does a paper's own named
  system go in Method, in named_resources, or in a Resource node type if E-9
  ever happens? It recurs on every paper in this set and currently has two
  different answers. CAFE (0.65) rides on the same decision.

  THE NINE FEATURES ARE DELIBERATELY NOT SCORED INDIVIDUALLY. f1–f9 include
  N-path centrality, the Jaccard index, the Adamic/Adar index, cosine
  similarity, dot product, and one-hot type vectors — each named, each grounded,
  each stated in exactly one bullet. Scoring them would add nine recall
  obligations for sub-components of a single contribution, which is the same
  call reconciliation already made against "relation clustering" and
  "Levenshtein similarity" on cskg2. The aggregate is scored instead, as the
  concept "neighbourhood-aware features". If reconciliation prefers the
  granular treatment, it should revisit cskg2 in the same change.

  ONE TOPIC, WHICH BREAKS THE PATTERN OF THE FIRST TWO PAPERS. Both cskg and
  cskg2 scored "Knowledge Graphs" + "Information Extraction". Information
  Extraction is wrong here — this paper never extracts anything from text, it
  completes a graph that already exists. I considered and rejected: "Machine
  Learning" and "Deep Learning" (the authors' own INDEX TERMS do list "machine
  learning", and the classifier is a feedforward network, so an emission is
  plausible — but both are over-general and the prompt asks for the smallest
  set); "Graph Neural Networks" (named once, in related work, as an approach
  the paper does NOT use — a likely and clearly wrong importer emission);
  "Knowledge Representation" (the parent area of the scored subtopic, the same
  extra recorded on both previous papers). All four belong in
  acceptable_extras.topics at reconciliation.

  FALSE FRIEND — "FINE-TUNED" DOES NOT MEAN FINE-TUNING HERE. The paper says
  the neural classifier "can be ﬁne-tuned for the KG in question", immediately
  followed by "The hyperparameters used in the evaluation are discussed in
  Section IV-A". That is hyperparameter tuning, not the transfer-learning
  method scored as "fine-tuning" on cskg2. I have not scored it. I expect the
  importer to extract it anyway, and if it does, that is a genuine
  false positive worth keeping in the diff rather than excusing.

  NOT SCORED, RECORDED SO THE OMISSIONS ARE VISIBLE: manual annotation (five
  domain experts annotated AIKG-500 — real, but one step from the banned
  generic "evaluation", and parked in acceptable_extras on cskg for exactly
  this reason); inter-annotator agreement / Cohen's kappa (same, and cskg's
  Fleiss' kappa was treated the same way); ROC curve analysis and binary
  cross-entropy loss (real but closer to "evaluation" and "training" than to
  named recipes); "incompleteness" (the paper's motivation, but a property
  rather than a technique — it is carried by the problems instead);
  type-constrained negative sampling (a refinement of the scored negative
  sampling, folded in as an alias rather than split out).

  NAMED RESOURCES, same open question as both predecessors: AI-KG, AI-KG 1.2,
  ORKG, UMLS, Nanopublications, CSO, TKG, FreeBase, WordNet, NELL, DBpedia,
  BIBO, SPAR, OpenKE, plus the benchmark datasets AIKG-1M, AIKG-500, FB13,
  WN11, WN18, WN18RR and NELL. Two things make this paper harder than the
  others. First, AI-KG is not merely mentioned — it is the object of the
  paper's use case, and the paper releases a new version of it. Second, the
  benchmarks here are contributions, not just references: AIKG-1M and AIKG-500
  are datasets this paper creates and releases. A resource the paper *produces*
  is a stronger case for a first-class node than one it cites. See
  docs/ground-truth/named-resources.md.

  WEAKEST ENTRIES, IN ORDER: BERT (0.5) — named only as SciBERT's lineage, via
  the dehyphenated "BERTbased", and scored only to match cskg2; reification
  (0.6) — third chain occurrence but the thinnest of the three, since this
  paper consumes reified data rather than producing it; RotatE (0.6) —
  mentioned, never evaluated; CAFE (0.65) and DeLong's test (0.65); word
  embeddings (0.7) — real and load-bearing for two features, but close to the
  concept prompt's generic line; link prediction (0.7) — see the aliasing
  conflict above.

  STILL OPEN: s2_paper_id, unresolved on all three papers so far. Also the
  source_pdf filename above is a guess — README.md abbreviates it as
  "Completing_Scientific_Facts_...pdf" and I could not verify the real name.
