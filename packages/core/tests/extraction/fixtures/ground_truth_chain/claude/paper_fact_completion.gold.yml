# Independent Claude review — produced from paper_fact_completion.txt only.
# No human review of this paper exists yet, and the importer's output
# (docs/ground-truth/importer-output/) was deliberately not opened. The two
# already-reconciled files (cskg, cskg2) WERE consulted, but only for alias sets
# and canonical spellings of recurring entities — that is the chain-consistency
# rule those files established, not a leak of a competing review of this paper.
# See ../SCHEMA.md for the field contract.
#
# Quote convention: verbatim from paper_fact_completion.txt with internal
# whitespace normalised to single spaces. This paper carries BOTH extraction
# hazards seen so far: IEEE Access ligatures (ﬁ x104, ﬂ x4 — as in cskg) AND
# glued footnote numerals ("SciCheck6", "model7" — as in cskg2). Quotes preserve
# both. It also splits five tokens across line breaks ("classi- ﬁer",
# "Sci- Check", "AIKG- 500"); quotes avoid those spans. See notes.

paper_id: "doi:10.1109/access.2022.3220241"
slug: "fact_completion"
title: "Completing Scientific Facts in Knowledge Graphs of Research Concepts"
doi: "10.1109/access.2022.3220241"
s2_paper_id: null
source_pdf: "ground-truth-papers/Completing_Scientific_Facts_in_Knowledge_Graphs_of_Research_Concepts.pdf"
year: 2022
reviewer: "claude"
reviewed_at: "2026-08-08"

# --------------------------------------------------------------- scored keys

# ONE topic, against two on both previous papers — see notes. This paper does
# not do information extraction; it completes a graph that already exists, so
# "Information Extraction" would be wrong here rather than merely over-general.
expected_topics:
  - name: "Knowledge Graphs"
    level: "subtopic"

expected_concepts:
