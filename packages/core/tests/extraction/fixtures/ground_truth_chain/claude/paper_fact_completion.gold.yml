      - "scientific knowledge graphs"
      - "scholarly knowledge graph"
      - "scholarly knowledge graphs"
      - "large-scale knowledge graph"
      - "knowledge graph of research concepts"
      - "knowledge graphs of research concepts"
      - "KGs of research concepts"
    quoted_text: "we have witnessed the emergence of several knowledge graphs that explicitly describe research knowledge with the aim of enabling intelligent systems for supporting and accelerating the scientiﬁc process"
    confidence: 0.9

  - canonical: "triple classification"
    acceptable_aliases:
      - "triple classiﬁcation"     # ligature form, as extracted
      - "triple classifier"
    quoted_text: "we introduce SciCheck, a new triple classiﬁcation approach for completing scientiﬁc statements in knowledge graphs"
    confidence: 0.95

  # NOT aliased to link prediction here, unlike cskg2 — this paper treats the
  # two as sibling techniques in one sentence. Direct chain conflict, flagged
  # in notes as the most important thing in this file.
  - canonical: "knowledge graph completion"
    acceptable_aliases:
      - "KG completion"
      - "knowledge graph completion methods"
    quoted_text: "existing methods for knowledge graph completion under-perform on KGs of research concepts"
