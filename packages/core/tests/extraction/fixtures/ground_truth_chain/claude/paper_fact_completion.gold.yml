# ------------------------------------------------------------- unscored keys

problems:
  # The chain link back to cskg's P1 — the same "we need machine-readable
  # research knowledge" framing, three years earlier in the lineage.
  - statement: "Research knowledge on the web is not available as a semantically rich, interlinked, machine-readable description, which is what would enable sophisticated automated analysis of the scientific literature."
    quoted_text: "One of the main challenges in this space is to generate a semantically rich, interlinked, and machine readable description of the available research knowledge."
    involves_concepts:
      - "scientific knowledge graph"

  - statement: "Knowledge graphs describing research concepts are very partial representations of the actual research knowledge and miss relevant facts that neither information extraction approaches nor human experts identified."
    quoted_text: "They are typically very partial representations of the actual research knowledge and may lack several relevant facts, that were not identiﬁed by information extraction approaches or human experts."
    involves_concepts:
      - "scientific knowledge graph"
      - "knowledge graph completion"

  # The paper's headline problem and its reason for existing.
  - statement: "Existing knowledge graph completion methods under-perform specifically on knowledge graphs of research concepts, and in particular suffer from low precision, which is unacceptable in the scientific domain."
    quoted_text: "existing methods for knowledge graph completion under-perform on KGs of research concepts, as detailed in Section IV. In particular, they suffer from low precision, which is not acceptable in the scientiﬁc domain."
    involves_concepts:
      - "knowledge graph completion"
      - "triple classification"

  - statement: "Knowledge graphs record only positive knowledge, so there are no negative triples available to train a classifier against, and they must be manufactured."
    quoted_text: "Knowledge Graphs only contain positive knowledge, i.e., triples for which their heads and tails are known to be related by means of a relationship. However, in order to train a classiﬁer, negative triples are also needed."
    involves_concepts:
      - "triple classification"

  # Direct counterpart of cskg2's benchmark problem — both papers independently
  # say the community's standard link-prediction/triple-classification
  # benchmarks are inadequate, for different reasons.
  - statement: "The traditional benchmarks used for triple classification leak information between their training and test sets because they contain reciprocal relations, which inflates measured performance."
    quoted_text: "It is well-known [63] that these traditional benchmarks suffer from information leakage between the training and test sets, due to the presence of reciprocal relations."
    involves_concepts:
      - "knowledge graph completion"

