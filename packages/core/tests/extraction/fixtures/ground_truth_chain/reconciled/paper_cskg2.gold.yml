# Reconciled answer key — human/paper_cskg2.gold.yml + claude/paper_cskg2.gold.yml,
# adjudicated against paper_cskg2.txt line by line and agreed 2026-08-08.
# Every disagreement is recorded in `disagreements:`; nothing was resolved silently.
#
# Quote convention: quoted_text is verbatim from paper_cskg2.txt with internal
# whitespace normalised to single spaces. Unlike paper_cskg.txt, this file has NO
# ligatures (ﬁ/ﬀ count is zero) — Nature's typesetting differs from Springer LNCS.
# It has a different artifact instead: superscript reference numerals are glued
# onto the preceding token ("SciBERT59", "TransR65", "CS-KG50"). Quotes preserve
# that, and every affected entity carries the glued form as an alias.
#
# Alias policy for this file: where an entity also appears in
# reconciled/paper_cskg.gold.yml, its alias set MIRRORS that file and adds only
# forms grounded in cskg2. Chain consistency is the point of this set — the same
# importer output must score the same way on both papers, or "concept accumulates
# across the citation chain" measures our labeling drift instead.

# ---------------------------------------------------------------- identity
paper_id: "doi:10.1038/s41597-025-05200-8"
slug: "cskg2"
title: "CS-KG 2.0: A Large-scale Knowledge Graph of Computer Science"
doi: "10.1038/s41597-025-05200-8"
s2_paper_id: null            # not looked up; same open item as cskg
year: 2025
source_pdf: "ground-truth-papers/CS_KG_2.0_2025.pdf"
reviewer: "reconciled"
reviewed_at: "2026-08-06"

