problems:                    # ExtractedProblem is a LIST per paper, not one
  - statement: "An increasing number of scientific papers are being published in formats that are difficult for AI tools to parse, such as PDF files and unstructured plain text."         # >=20 chars (importer's own floor)
    quoted_text: "Nonetheless, a significant challenge remains: processing the vast quantity of scientific papers, which continues to expand at a rate of approximately 2.5 million new articles each year11. The large number of research articles, often found in hard-to-parse PDF files or, at best, as unstructured plain text, poses significant challenges for AI technologies12."       # >=10 chars
    involves_concepts: ["scientific knowledge graph", "information extraction pipeline"]
  
  - statement: "Current search and analysis engines for research papers, even those making use of advanced LLMs, are typically limited to simple searching due to the aforementioned large volume of information."
    quoted_text: "As a result, current search engines are limited, mainly performing simple searches based on keywords or the semantic similarity of a query with titles and abstracts."
    involves_concepts: 
    - "information extraction pipeline"
  
  - statement: "While LLMs may be able to process and respond to natural-language inquiries about a single paper, a collection of millions of papers is far too complex for them to accurately retrieve information about."
    quoted_text: "The capability of effectively interpreting and answering natural language questions about a single 15-page paper, a task currently undertaken by several LLM-based services4, does not extend to understanding the key entities, narratives, and concepts of a research field represented by millions of such papers"
    involves_concepts:
    - "scientific knowledge graph"
  
  - statement: "Resources such as AI-KG are relatively small-scale and low-scope compared to the entire domain of computer science; additionally, they build semantically shallow relationships between entities."
    quoted_text: "However, user feedback has highlighted some limitations of AI-KG: its coverage is restricted to 330,000 research papers, the semantic depth of the relationships between entities is relatively shallow, and its scope is confined exclusively to the domain of artificial intelligence."
    involves_concepts:
    - "scientific knowledge graph"
    - "knowledge representation"

  - statement: "CS-KG 1.0, while broader and richer than AI-KG, is also limited in that it lacks time-related information, can exclude recent publications if they are not yet cited by other papers, and relies on an outdated resource (the Microsoft Academic Graph), making it difficult to update."
    quoted_text: "CS-KG lacks time-related information for its entities, which is essential for analyzing trends in the adoption and evolution of various methods and materials. Second, it only includes research papers that are cited at least once, thereby excluding some of the most recent publications. Finally, CS-KG is based on the Microsoft Academic Graph (MAG), a resource that has since been discontinued."
    involves_concepts:
    - "scientific knowledge graph"
    - "knowledge representation"

  - statement: "Commonly-used link prediction benchmarks are relatively small-scale, limiting their usefulness in validating state-of-the-art link prediction solutions."
    quoted_text: "Specifically, the link prediction benchmarks commonly used in the community, such as WN1851 and FB15k51, usually feature tens of thousands of triples. By current standards, these datasets are considered small."
    involves_concepts:
    - "link prediction"

