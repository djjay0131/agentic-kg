problems:                    # ExtractedProblem is a LIST per paper, not one
  - statement: "Although knowledge graphs for research progression have emerged to streamline research in recent years, most of these are limited in scope due to relying on manual methods to extract and process literature information."         # >=20 chars (importer's own floor)
    quoted_text: "A common limitation of these solutions is that they address a low number of articles, either because they rely on human experts to summarize information from the literature or because they focus on specific research areas."       # >=10 chars
    involves_concepts: ["scientific knowledge graph"]
  
  - statement: "Previous scientific knowledge graphs, such as AI-KG, fail to properly process different lexical variants of nouns and verbs, resulting in duplicate entities and missed relations in the knowledge graph."
    quoted_text: "the methodology for integrating different lexical variations of entities did not always work, resulting in multiple versions of the same entity"
    involves_concepts: 
    - "scientific knowledge graph"

