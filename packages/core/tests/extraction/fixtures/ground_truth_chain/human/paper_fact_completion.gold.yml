problems:                    # ExtractedProblem is a LIST per paper, not one
  - statement: "Existing knowledge graphs describing research knowledge typically miss relevant information about the reserach knowledge they were derived from."
    quoted_text: "However, they are usually very partial representations of the actual research knowledge and may miss several relevant facts."
    involves_concepts: ["scientific knowledge graph"]
  
  - statement: "A machine-readable, complete, and extensive representation of knowledge in open research is not yet available, preventing more advanced researdch services from being provided."
    quoted_text: "One of the main challenges in this space is to generate a semantically rich, interlinked, and machine readable description of the available research knowledge. This could enable more sophisticated techniques to analyze the scientiﬁc literature."
    involves_concepts: ["scientific knowledge graph", "Open Science"]
  
  - statement: "Existing knowledge graph comnpletion methods are imprecise on knowledge graphs of research concepts, making them unacceptable for use in the sciences, which rely on precise links between concepts."
    quoted_text: "However, existing methods for knowledge graph completion under-perform on KGs of research concepts, as detailed in Section IV. In particular, they suffer from low precision, which is not acceptable in the scientiﬁc domain."
    involves_concepts: ["scientific knowledge graph", "knowledge graph completion"]

