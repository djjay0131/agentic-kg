# Roll Cloud Run onto the newest version of a vendor-issued API key (ADR-0007).
#
# Vendor keys (Semantic Scholar, OpenAI) are issued by the vendor, so no
# workflow can generate them. Their ONLY home is Secret Manager: the owner adds
# a new version there directly (GCP console, or
# `gcloud secrets versions add <SECRET> --data-file=-` on his own machine) and
# then runs this workflow. It replaces sync-s2-key.yml, which copied the value
# from a GitHub secret.
#
# This workflow never reads, pipes or prints a key. It only:
#   1. checks the newest ENABLED version is not the Terraform placeholder seed
#      (by comparing version NUMBERS: the seed is version 1)
#   2. rolls the consumers onto `:latest` with a label stamp (`:latest` alone is
#      not a config change, so the label forces a fresh revision)
#   3. verifies the API is healthy (for OPENAI_API_KEY)
#   4. only then disables the superseded versions

name: Roll Vendor API Keys

on:
  workflow_dispatch:
    inputs:
      secret:
        description: 'Which vendor key was updated in Secret Manager'
        required: true
        type: choice
        options:
          - SEMANTIC_SCHOLAR_API_KEY
          - OPENAI_API_KEY
      reason:
        description: 'Why (recorded in the summary)'
        required: false
        default: 'vendor key rotated'

concurrency:
  group: roll-vendor-keys-${{ github.event.inputs.secret }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: us-central1
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ENVIRONMENT: staging
  SECRET: ${{ github.event.inputs.secret }}

jobs:
  roll:
    name: Roll staging consumers onto the newest ${{ github.event.inputs.secret }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check a real version exists (metadata only)
        run: |
          set -euo pipefail
          NEWEST="$(gcloud secrets versions list "$SECRET" --project="$PROJECT_ID" \
            --filter='state=ENABLED' --sort-by='~createTime' --format='value(name)' | head -n1)"
          if [ -z "$NEWEST" ] || [ "$NEWEST" = "1" ]; then
            echo "::error::$SECRET has no version newer than the Terraform seed. Add the key in Secret Manager first."
            exit 1
          fi
          echo "Newest enabled $SECRET version: $NEWEST"

      - name: Roll the ingest Job
        run: |
          gcloud run jobs update "agentic-kg-ingest-$ENVIRONMENT" \
            --region="$REGION" --project="$PROJECT_ID" \
            --update-secrets="$SECRET=$SECRET:latest" \
            --update-labels=vendor-key-rolled=${{ github.run_id }}

      - name: Roll the API service (OpenAI only)
        if: github.event.inputs.secret == 'OPENAI_API_KEY'
        run: |
          gcloud run services update "agentic-kg-api-$ENVIRONMENT" \
            --region="$REGION" --project="$PROJECT_ID" \
            --update-secrets="$SECRET=$SECRET:latest" \
            --update-labels=vendor-key-rolled=${{ github.run_id }}

      - name: Verify the API is healthy
        if: github.event.inputs.secret == 'OPENAI_API_KEY'
        run: |
          set -euo pipefail
          API_URL="$(gcloud run services describe "agentic-kg-api-$ENVIRONMENT" \
            --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')"
          for _ in $(seq 1 20); do
            if curl -fsS "$API_URL/health" >/dev/null; then echo "API healthy."; exit 0; fi
            sleep 6
          done
          echo "::error::API not healthy after rolling $SECRET"
          exit 1

      - name: Disable superseded versions
        run: |
          set -euo pipefail
          gcloud secrets versions list "$SECRET" --project="$PROJECT_ID" \
            --filter='state=ENABLED' --sort-by='~createTime' --format='value(name)' \
          | tail -n +2 \
          | while read -r version; do
              gcloud secrets versions disable "$version" --secret="$SECRET" --project="$PROJECT_ID"
              echo "Disabled superseded $SECRET version $version."
            done

      - name: Summary
        env:
          REASON: ${{ github.event.inputs.reason }}
        run: |
          {
            echo "## Vendor key roll"
            echo ""
            echo "- Secret: \`$SECRET\` (values never read by this workflow)"
            echo "- Environment: \`$ENVIRONMENT\`"
            echo "- Reason: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"
