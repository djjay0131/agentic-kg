# Automatic master deployment workflow
# Trigger: Push to master (typically after PR merge)
# Use case: Deploy to staging automatically, optionally promote to production

name: Deploy Master

on:
  push:
    branches:
      - master
      - main
    paths:
      # Only deploy when relevant code changes
      - 'packages/**'
      - 'docker/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy-*.yml'

env:
  # Ephemeral runners: no reaper needed, and its image pull hits Docker Hub limits.
  TESTCONTAINERS_RYUK_DISABLED: "true"
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1

permissions:
  contents: read

# Staging deploys must be strictly serial: two pushes to master a few seconds
# apart used to run their deploys concurrently, and the older commit's deploy
# could finish last (runs 46040927025 / 46040957438). A single repository-wide
# group is shared with deploy-branch.yml when it targets staging. A queued run
# waits; it never cancels an in-flight deploy, so a cancellation cannot leave a
# half-rolled environment. The default queue (`single`) also drops a superseded
# pending run in favour of the newest, and the `staging-head-guard` job below
# makes the newest commit win even if GitHub's FIFO ordering slips.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Detect which packages changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      job: ${{ steps.filter.outputs.job }}
      experiment: ${{ steps.filter.outputs.experiment }}
      any_service: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.ui == 'true' || steps.filter.outputs.job == 'true' || steps.filter.outputs.experiment == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/core/**'
              - 'pyproject.toml'
            api:
              - 'packages/api/**'
              - 'packages/core/**'
              - 'docker/Dockerfile.api'
            ui:
              - 'packages/ui/**'
              - 'packages/core/**'
              - 'docker/Dockerfile.ui'
            # Intentionally broad: the ingest Job is built from core, so any
            # core change may affect it. Over-triggers rather than risk a stale
            # Job. See deploy-pipeline-fix.md (QA Q4).
            job:
              - 'packages/core/**'
              - 'pyproject.toml'
              - 'docker/Dockerfile.job'
            experiment:
              - 'packages/core/src/agentic_kg/agents/experiment_runner.py'
              - 'docker/Dockerfile.experiment'

  # Run full test suite
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -e packages/core

      - name: Run linting
        run: |
          # Lint source only, matching the project standard (code-review.yml).
          # The test tree has 172 pre-existing violations (SM-5); linting it
          # here — an aspiration never enforced while this workflow was broken —
          # diverges from that standard and would block deploys. Re-add
          # packages/core/tests once SM-5 is cleaned up.
          ruff check packages/core/src

      - name: Run unit tests
        run: |
          # Unit tests only. Exclude tests needing external resources:
          # knowledge_graph (Neo4j), e2e (live APIs), and integration/costly
          # markers (live embeddings + Neo4j, "skipped by default"). The .[dev]
          # install here includes testcontainers, so without the marker filter
          # those opt-in tests spin up Neo4j and run — failing on the missing
          # OpenAI key. Matches code-review.yml's `-m "not integration"`.
          python -m pytest packages/core/tests -v \
            --ignore=packages/core/tests/knowledge_graph \
            --ignore=packages/core/tests/e2e \
            -m "not integration and not costly" \
            -x --tb=short

  # Newest-wins guard. Concurrency serialises runs, but GitHub does not
  # guarantee the order in which queued runs acquire the group; the older run
  # of two closely spaced pushes could still execute after the newer one. This
  # job skips the build and deploy when origin/<branch> has moved past this
  # commit in a path that would itself trigger a deploy. A docs-only commit
  # after this one does not supersede it (see scripts/staging_deploy_guard.sh).
  # Full history is fetched so the guard can diff this commit against HEAD.
  staging-head-guard:
    name: Check this commit is still current
    needs: [changes]
    if: needs.changes.outputs.any_service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      superseded: ${{ steps.guard.outputs.superseded }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with the branch tip
        id: guard
        run: ./scripts/staging_deploy_guard.sh

  # Build changed services. build-images parses the services string with grep,
  # so trailing commas from skipped services are harmless.
  #
  # Gated on the guard as well as the deploy: a superseded run must not even
  # push its `latest` image, or the older build could overwrite the newer tag
  # after the newer deploy already ran.
  build:
    needs: [changes, test, staging-head-guard]
    if: >-
      needs.changes.outputs.any_service == 'true' &&
      needs.staging-head-guard.outputs.superseded != 'true'
    # build-images.yml (reusable) requests id-token: write for WIF auth. The
    # repo's default GITHUB_TOKEN permission is read-only, and a reusable call
    # cannot request more than the caller grants — without this block GitHub
    # rejects the whole workflow at startup (the real cause of 34/34
    # startup_failure since 2026-02-05).
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-images.yml
    with:
      services: >-
        ${{ needs.changes.outputs.api == 'true' && 'api,' || '' }}${{ needs.changes.outputs.ui == 'true' && 'ui,' || '' }}${{ needs.changes.outputs.job == 'true' && 'job,' || '' }}${{ needs.changes.outputs.experiment == 'true' && 'experiment' || '' }}
      image_tag: latest
      push: true
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  # Deploy to staging
  deploy-staging:
    needs: [changes, build, staging-head-guard]
    if: >-
      needs.changes.outputs.any_service == 'true' &&
      needs.staging-head-guard.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # `services update`, not `deploy`: it rolls the image without touching
      # env, secrets, scaling, port or IAM. Terraform owns those now, and the
      # KGIS/KGCS opt-in flags must survive a deploy (#112).
      - name: Deploy API to staging
        if: needs.changes.outputs.api == 'true'
        run: |
          gcloud run services update agentic-kg-api-staging \
            --image=${{ needs.build.outputs.api_image }} \
            --region=${{ env.REGION }} \
            --update-labels=environment=staging,commit=${{ github.sha }}

      - name: Deploy UI to staging
        if: needs.changes.outputs.ui == 'true'
        run: |
          gcloud run services update agentic-kg-ui-staging \
            --image=${{ needs.build.outputs.ui_image }} \
            --region=${{ env.REGION }} \
            --update-labels=environment=staging,commit=${{ github.sha }}

      # The ingest Cloud Run Job runs the actual paper-ingestion pipeline.
      # Before this step the workflow only touched Services, so the Job ran
      # stale pre-entity-expansion code. `jobs update` re-points it at the
      # freshly-built image and stamps the commit label for verification.
      - name: Deploy ingest Job to staging
        if: needs.changes.outputs.job == 'true'
        run: |
          gcloud run jobs update agentic-kg-ingest-staging \
            --image=${{ needs.build.outputs.job_image }} \
            --region=${{ env.REGION }} \
            --update-labels=environment=staging,commit=${{ github.sha }}

      # The experiment Job is created by Terraform. If the first deploy beats
      # the Terraform apply, leave it alone: the Job template already points at
      # :latest, which this build just pushed.
      - name: Deploy experiment Job to staging
        if: needs.changes.outputs.experiment == 'true'
        run: |
          if gcloud run jobs describe agentic-kg-experiment-staging --region=${{ env.REGION }} >/dev/null 2>&1; then
            gcloud run jobs update agentic-kg-experiment-staging \
              --image=${{ needs.build.outputs.experiment_image }} \
              --region=${{ env.REGION }} \
              --update-labels=environment=staging,commit=${{ github.sha }}
          else
            echo "agentic-kg-experiment-staging not created yet; Terraform owns creation"
          fi

      # The nightly orchestrator runs the same `job` image, so it is rolled in
      # lockstep with the ingest Job. It is created by Terraform (nightly_enabled);
      # if that has not been applied yet the Job is absent and this step is a
      # no-op rather than a deploy failure.
      - name: Deploy nightly Job to staging
        if: needs.changes.outputs.job == 'true'
        run: |
          if gcloud run jobs describe agentic-kg-nightly-staging \
              --region=${{ env.REGION }} >/dev/null 2>&1; then
            gcloud run jobs update agentic-kg-nightly-staging \
              --image=${{ needs.build.outputs.job_image }} \
              --region=${{ env.REGION }} \
              --update-labels=environment=staging,commit=${{ github.sha }}
          else
            echo "agentic-kg-nightly-staging not present (Terraform nightly_enabled not applied); skipping"
          fi

      # The adviser/review-queue stage runs the same `job` image and is rolled
      # in lockstep with it. Gated by nightly_curate_enabled in Terraform; if
      # the Job is absent this is a no-op, not a deploy failure.
      - name: Deploy adviser Job to staging
        if: needs.changes.outputs.job == 'true'
        run: |
          if gcloud run jobs describe agentic-kg-adviser-staging \
              --region=${{ env.REGION }} >/dev/null 2>&1; then
            gcloud run jobs update agentic-kg-adviser-staging \
              --image=${{ needs.build.outputs.job_image }} \
              --region=${{ env.REGION }} \
              --update-labels=environment=staging,commit=${{ github.sha }}
          else
            echo "agentic-kg-adviser-staging not present (Terraform nightly_curate_enabled not applied); skipping"
          fi

      # Assert Cloud Run actually reports the SHA we just deployed. Logic lives
      # in a unit-tested script (label-only in PR-1; PR-3 adds --check-version).
      - name: Assert deployed SHA matches
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REGION: ${{ env.REGION }}
          CHECK_API: ${{ needs.changes.outputs.api }}
          CHECK_UI: ${{ needs.changes.outputs.ui }}
          CHECK_JOB: ${{ needs.changes.outputs.job }}
        run: ./scripts/assert_deploy_parity.sh

      - name: Get staging URLs
        id: urls
        run: |
          if [ "${{ needs.changes.outputs.api }}" = "true" ]; then
            API_URL=$(gcloud run services describe agentic-kg-api-staging \
              --region=${{ env.REGION }} --format='value(status.url)')
            echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          fi

          if [ "${{ needs.changes.outputs.ui }}" = "true" ]; then
            UI_URL=$(gcloud run services describe agentic-kg-ui-staging \
              --region=${{ env.REGION }} --format='value(status.url)')
            echo "ui_url=${UI_URL}" >> $GITHUB_OUTPUT
          fi

      - name: Create staging deployment summary
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### URLs" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.changes.outputs.api }}" = "true" ]; then
            echo "- **API:** ${{ steps.urls.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.changes.outputs.ui }}" = "true" ]; then
            echo "- **UI:** ${{ steps.urls.outputs.ui_url }}" >> $GITHUB_STEP_SUMMARY
          fi

  # Automated post-deploy browser suite through IAP (T54). It replaces the
  # human/Claude-in-a-browser pass over docs/testing/staging-test-scripts.md
  # tracks A1-A4 plus B9. Auth is keyless: this job authenticates with the
  # existing Workload Identity Federation login (the deploy identity), then
  # signs a short-lived JWT *as* the dedicated `agentic-kg-e2e-<env>` service
  # account. IAP accepts that JWT because Terraform grants the account
  # roles/iap.httpsResourceAccessor on the UI service; the UI proxy forwards the
  # resulting assertion to the private API.
  #
  # Terraform owns that identity. Until the owner applies it, the account does
  # not exist; this job then posts a notice and passes rather than failing a
  # deploy for configuration that is not there yet.
  post-deploy-ui-tests:
    name: Post-deploy UI tests (IAP)
    needs: [changes, deploy-staging]
    if: needs.changes.outputs.any_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      REGION: us-central1
      UI_SERVICE: agentic-kg-ui-staging
      E2E_SERVICE_ACCOUNT: agentic-kg-e2e-staging@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check the dedicated test identity and resolve the UI URL
        id: probe
        run: |
          set -euo pipefail
          if ! gcloud iam service-accounts describe "$E2E_SERVICE_ACCOUNT" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Post-deploy UI tests skipped::The dedicated test identity $E2E_SERVICE_ACCOUNT does not exist yet. Apply the Terraform from the PR that adds it (one apply); this job then runs automatically."
            {
              echo "## Post-deploy UI tests: skipped"
              echo ""
              echo "The dedicated test identity \`$E2E_SERVICE_ACCOUNT\` does not exist yet."
              echo "Apply the Terraform from the PR that adds it once; the job then runs on every deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          UI_URL="$(gcloud run services describe "$UI_SERVICE" \
            --region="$REGION" --format='value(status.url)')"
          if [ -z "$UI_URL" ]; then
            echo "::error::could not resolve the staging UI URL"
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "ui_url=$UI_URL" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.probe.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and browsers
        if: steps.probe.outputs.exists == 'true'
        working-directory: e2e/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Mint after the slow install so the token's lifetime is spent on the
      # suite, not on downloading a browser. The signed JWT is written to the
      # runner temp directory and never echoed, stored in an output, or logged.
      - name: Mint the IAP service-account JWT
        if: steps.probe.outputs.exists == 'true'
        env:
          UI_URL: ${{ steps.probe.outputs.ui_url }}
        run: |
          set -euo pipefail
          NOW="$(date +%s)"
          CLAIM="$RUNNER_TEMP/e2e-iap-claim.json"
          cat > "$CLAIM" <<EOF
          {
            "iss": "$E2E_SERVICE_ACCOUNT",
            "sub": "$E2E_SERVICE_ACCOUNT",
            "aud": "${UI_URL}/*",
            "iat": ${NOW},
            "exp": $((NOW + 2700))
          }
          EOF
          gcloud iam service-accounts sign-jwt \
            --iam-account="$E2E_SERVICE_ACCOUNT" \
            "$CLAIM" "$RUNNER_TEMP/e2e-iap.jwt"
          rm -f "$CLAIM"

      - name: Run the post-deploy UI suite
        if: steps.probe.outputs.exists == 'true'
        working-directory: e2e/ui
        env:
          E2E_UI_URL: ${{ steps.probe.outputs.ui_url }}
        run: |
          : "${E2E_UI_URL:?E2E_UI_URL was not resolved}"
          # Read the short-lived JWT from the runner temp file into this
          # process only. It is never echoed, stored in an output, or committed.
          E2E_IAP_JWT="$(cat "$RUNNER_TEMP/e2e-iap.jwt")"
          export E2E_IAP_JWT
          npm test

      - name: Upload Playwright report and traces
        if: always() && steps.probe.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-ui-playwright-report
          path: |
            e2e/ui/playwright-report
            e2e/ui/test-results
          retention-days: 14
          if-no-files-found: warn

  # Run integration tests against staging
  integration-test:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install pytest requests

      - name: Run integration tests
        run: |
          # Placeholder for integration tests against staging
          echo "Integration tests would run here"
          # pytest tests/integration --base-url=$STAGING_API_URL

  # Update deployment manifest
  # `build` is required in needs because the manifest body references
  # needs.build.outputs.*; omitting it made `needs.build` an undefined-context
  # reference, which GitHub rejects at startup (root cause of this workflow
  # never running — 34/34 startup_failure since 2026-02-05).
  update-manifest:
    needs: [build, deploy-staging, integration-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Update deployment manifest
        run: |
          mkdir -p deploy
          cat > deploy/deployment-manifest.yaml << EOF
          # Auto-generated deployment manifest
          # Last updated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          environment: staging
          deployed_at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          deployed_by: github-actions
          commit: ${{ github.sha }}

          services:
            api:
              image: ${{ needs.build.outputs.api_image || 'not-deployed' }}
              sha: ${{ github.sha }}
            ui:
              image: ${{ needs.build.outputs.ui_image || 'not-deployed' }}
              sha: ${{ github.sha }}
          EOF

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment-manifest.yaml
          git diff --staged --quiet || git commit -m "chore: update deployment manifest [skip ci]"
          git push || echo "Nothing to push"
