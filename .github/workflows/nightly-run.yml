# Manual "run now" for the nightly ingestion pipeline (nightly-pipeline P1).
#
# Dispatches the same Cloud Workflows workflow the 02:30 America/New_York
# Cloud Scheduler job triggers, with trigger="manual" so the PipelineRun report
# records how it was started. Auth is WIF; no secret value is printed — only the
# execution state.
#
# Requires the CI service account to hold roles/workflows.invoker (see the
# "Owner bootstrap needed" section of the P1 PR; not granted in Terraform).

name: Run nightly pipeline now

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: us-central1
  WORKFLOW: agentic-kg-nightly-staging

jobs:
  run:
    name: Run nightly pipeline
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run the nightly workflow
        run: |
          set -euo pipefail

          # `gcloud workflows run` waits for the execution but exits 0 even when
          # the execution itself FAILED, so the job used to stay green while
          # nothing was ingested. Capture the execution, describe it, print the
          # error payload/context, and gate the job on state == SUCCEEDED.
          execution_name="$(
            gcloud workflows run "${WORKFLOW}" \
              --location="${REGION}" \
              --data='{"trigger":"manual"}' \
              --format='value(name)' || true
          )"
          if [ -z "${execution_name}" ]; then
            echo "::error::gcloud workflows run produced no execution name"
            exit 1
          fi
          execution_id="${execution_name##*/}"
          echo "Execution: ${execution_id}"

          gcloud workflows executions describe "${execution_id}" \
            --workflow="${WORKFLOW}" \
            --location="${REGION}" \
            --format=json > execution.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          execution = json.loads(Path("execution.json").read_text(encoding="utf-8"))
          state = execution.get("state", "UNKNOWN")
          print(f"state={state}")
          print(f"startTime={execution.get('startTime')}")
          print(f"endTime={execution.get('endTime')}")
          error = execution.get("error")
          print("error=" + ("null" if error is None else json.dumps(error, indent=2, sort_keys=True)))
          print("status=" + ("null" if execution.get("status") is None else json.dumps(execution["status"], indent=2, sort_keys=True)))
          Path("execution_state").write_text(state, encoding="utf-8")
          PY

          state="$(cat execution_state)"
          if [ "${state}" != "SUCCEEDED" ]; then
            echo "::error::Cloud Workflows execution ${execution_id} ended in state ${state} (expected SUCCEEDED)"
            exit 1
          fi
