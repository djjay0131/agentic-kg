# Integration Tests Workflow
#
# The integration job runs against a PER-RUN, throwaway Neo4j (testcontainers),
# NOT shared staging. History: it used staging, and the test fixture swept every
# TEST_-prefixed node before and after each test. The prefix is run-global, so
# two runs on different refs deleted one another's in-flight rows -- surfacing
# as "NotFoundError: <uuid> not found" on nodes the test had just created.
# Every integration-job failure in the 40 runs before 2026-09-19 sat inside an
# overlap window with another integration job. A per-run database removes the
# shared namespace entirely; it is also faster (~47s vs ~150s) than staging.

name: Integration Tests

on:
  push:
    branches: [master, 'integration/**']
  pull_request:
    branches: [master, 'integration/**']
    paths:
      - 'packages/core/**'
      - 'pyproject.toml'

# A merge into a long-lived integration branch fires both the PR-close and the
# push event; without a group they race and burn double the runner minutes.
#
# NOTE: this group is keyed per-ref and therefore does NOT serialise different
# PRs against each other. It never did. Do not rely on it for database
# isolation -- that is the per-run Neo4j container's job.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run unit tests
        run: |
          pytest packages/core/tests/ \
            --ignore=packages/core/tests/e2e \
            -m "not integration" \
            -v --tb=short \
            --junitxml=test-results/unit-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  integration-tests:
    name: Integration Tests (Neo4j)
    runs-on: ubuntu-latest
    needs: unit-tests
    # This job no longer consumes any secret -- it runs against a container it
    # starts itself -- so the fork restriction below is no longer about secret
    # availability. It is kept only to bound runner spend on fork PRs, and can
    # be dropped safely. Do NOT re-add staging credentials here to "fix" a fork
    # PR: the suite is designed to refuse a shared database.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run integration tests
        # No NEO4J_URI and no ownership flag. The conftest starts a throwaway
        # Neo4j container belonging to this run alone, and that -- starting the
        # container -- is the only thing that licenses the teardown sweep.
        # Adding NEO4J_URI here does not re-enable the shared-staging topology;
        # it makes the suite refuse to run.
        run: |
          pytest packages/core/tests/knowledge_graph/ \
            -m integration \
            -v --tb=short \
            --junitxml=test-results/integration-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  e2e-tests:
    name: E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: integration-tests
    # Only run on push to master (not PRs) to avoid excessive staging usage
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run E2E tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_NEO4J_URI: ${{ secrets.STAGING_NEO4J_URI }}
          STAGING_NEO4J_USER: neo4j
          STAGING_NEO4J_PASSWORD: ${{ secrets.STAGING_NEO4J_PASSWORD }}
        run: |
          pytest packages/core/tests/e2e/ \
            -m "e2e and not costly" \
            -v --tb=short \
            --junitxml=test-results/e2e-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
