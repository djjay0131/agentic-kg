# Integration Tests Workflow
# Runs integration tests against staging Neo4j instance
# Tests clean up after themselves using TEST_ prefix

name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - 'packages/core/**'
      - 'pyproject.toml'
  # Manual trigger. The E2E job otherwise only runs on push to master, so a
  # PR author had no way to exercise it before merge. Dispatch runs it against
  # the selected ref; set run_e2e=false for integration tests only.
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run E2E tests against staging'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run unit tests
        run: |
          pytest packages/core/tests/ \
            --ignore=packages/core/tests/e2e \
            -m "not integration" \
            -v --tb=short \
            --junitxml=test-results/unit-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  integration-tests:
    name: Integration Tests (Neo4j)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run if we have the secrets configured. workflow_dispatch is allowed
    # so a branch can be exercised manually before merge.
    if: |
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run integration tests
        env:
          NEO4J_URI: ${{ secrets.STAGING_NEO4J_URI }}
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ${{ secrets.STAGING_NEO4J_PASSWORD }}
        run: |
          pytest packages/core/tests/knowledge_graph/ \
            -m integration \
            -v --tb=short \
            --junitxml=test-results/integration-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  e2e-tests:
    name: E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: integration-tests
    # Only run on push to master (not PRs) to avoid excessive staging usage.
    # A manual workflow_dispatch may opt in (run_e2e, default true) so a
    # branch can be verified against staging before merge.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run E2E tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_NEO4J_URI: ${{ secrets.STAGING_NEO4J_URI }}
          STAGING_NEO4J_USER: neo4j
          STAGING_NEO4J_PASSWORD: ${{ secrets.STAGING_NEO4J_PASSWORD }}
          # #80 finding 5: the e2e job previously passed no S2 key, so the
          # selected test_acquisition tests hit the shared anonymous pool and
          # flaked on 429s. Same failure mode the smoke job fixed in #58.
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          # Fail loudly if a required secret is absent. conftest.py skips
          # when STAGING_NEO4J_PASSWORD is unset, which would let pytest exit
          # 0 on an all-skipped run and report a green job that asserted
          # nothing about staging (#80).
          : "${STAGING_API_URL:?STAGING_API_URL secret is not set}"
          : "${STAGING_NEO4J_URI:?STAGING_NEO4J_URI secret is not set}"
          : "${STAGING_NEO4J_PASSWORD:?STAGING_NEO4J_PASSWORD secret is not set}"
          : "${SEMANTIC_SCHOLAR_API_KEY:?SEMANTIC_SCHOLAR_API_KEY secret is not set}"

          pytest packages/core/tests/e2e/ \
            -m "e2e and not costly" \
            -v --tb=short \
            --junitxml=test-results/e2e-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
