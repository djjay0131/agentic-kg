# Integration Tests Workflow
# Runs integration tests against staging Neo4j instance
# Tests clean up after themselves using TEST_ prefix

name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - 'packages/core/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run unit tests
        run: |
          pytest packages/core/tests/ \
            --ignore=packages/core/tests/e2e \
            -m "not integration" \
            -v --tb=short \
            --junitxml=test-results/unit-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  integration-tests:
    # ADR-0003: staging Neo4j is VPC-private; GitHub runners cannot reach it.
    # Run the integration-marked suite against an ephemeral testcontainers
    # Neo4j instead (the conftest already supports this when NEO4J_URI is
    # unset). No STAGING_NEO4J_* secret is consulted.
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run if the PR is from this repository
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run integration tests
        # No NEO4J_* env: the conftest starts an ephemeral Neo4j container.
        run: |
          pytest packages/core/tests/knowledge_graph/ \
            -m integration \
            -v --tb=short \
            --junitxml=test-results/integration-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  e2e-tests:
    # ADR-0003: the core e2e suite needs direct DB access, which is now
    # VPC-private, so it no longer runs in CI. This job exercises the
    # deployed public API instead; its /health assertion (`neo4j_connected`)
    # is the end-to-end proof that the private Neo4j path works from inside
    # the VPC. No STAGING_NEO4J_* secret is consulted.
    name: E2E Tests (Staging API)
    runs-on: ubuntu-latest
    needs: integration-tests
    # Only run on push to master (not PRs) to avoid excessive staging usage
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio httpx websockets
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run API E2E tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          pytest packages/api/tests/e2e/ \
            -m "e2e" \
            -v --tb=short \
            --junitxml=test-results/e2e-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
