# Integration Tests Workflow
#
# The integration job runs against a PER-RUN, throwaway Neo4j (testcontainers),
# NOT shared staging. History: it used staging, and the test fixture swept every
# TEST_-prefixed node before and after each test. The prefix is run-global, so
# two runs on different refs deleted one another's in-flight rows -- surfacing
# as "NotFoundError: <uuid> not found" on nodes the test had just created.
# Every integration-job failure in the 40 runs before 2026-09-19 sat inside an
# overlap window with another integration job. A per-run database removes the
# shared namespace entirely; it is also faster (~47s vs ~150s) than staging.

name: Integration Tests

on:
  push:
    branches: [master, 'integration/**']
  pull_request:
    branches: [master, 'integration/**']
    paths:
      - 'packages/core/**'
      - 'pyproject.toml'

# A merge into a long-lived integration branch fires both the PR-close and the
# push event; without a group they race and burn double the runner minutes.
#
# NOTE: this group is keyed per-ref and therefore does NOT serialise different
# PRs against each other. It never did. Do not rely on it for database
# isolation -- that is the per-run Neo4j container's job.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run unit tests
        run: |
          pytest packages/core/tests/ \
            --ignore=packages/core/tests/e2e \
            -m "not integration" \
            -v --tb=short \
            --junitxml=test-results/unit-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  migration-canonical-adapter:
    # The KGIS/KGCS `migration` extra is opt-in, so no other job installs it —
    # ADR-0004 recorded that as an accepted risk only "until PR 2", i.e. until
    # the extra gained a real call site. The Neo4j canonical adapter is that
    # call site, so this is the job that keeps its conformance suite honest:
    # without it the seven shared contract tests would silently skip forever.
    name: KGCS canonical adapter (contract suite)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-migration-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (WITH the opt-in migration extra)
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio "testcontainers[neo4j]" docker
          pip install -e "./packages/core[migration]"

      - name: Assert the extra actually resolved
        # A skipped suite and a passing suite look identical in a green check.
        # Fail loudly here rather than letting `importorskip` quietly turn this
        # whole job into a no-op.
        run: |
          python -c "import kg_contracts, kgcs; print(kg_contracts.__file__); print(kgcs.__file__)"

      - name: Assert it resolved to the COMMIT the pyprojects pin
        # The step above proves the packages import. It does not prove *which
        # commit* they are -- and that is the one thing that matters here:
        # agentic-kgcs shipped a three-way breaking change (#34) while leaving
        # version = "1.0.0" untouched, so two incompatible packages self-report
        # the same version and only the SHA tells them apart. Same shape as the
        # suite_gate lesson one layer down: proving *something* resolved is not
        # proving *the named thing* resolved. pin_gate also rejects a mutable
        # (branch/tag) pin and the two pyprojects drifting apart.
        # test_pin_gate.py drives each of those paths to a real failure.
        run: |
          python packages/core/tests/migration/neo4j/pin_gate.py \
            pyproject.toml packages/core/pyproject.toml

      - name: Type-check the adapter (mypy, WITH the extra resolved)
        # Deliberately NOT `|| true`, and deliberately in *this* job: the
        # repo's other mypy invocation (code-review.yml) both swallows its exit
        # code and runs without the migration extra, so `kg_contracts` degrades
        # to `Any` there and the check is doubly meaningless. kg_contracts DOES
        # ship py.typed (unlike kgis/kg_eval/kgcs), so with the extra installed
        # mypy really does check this adapter against the port signatures.
        run: |
          pip install mypy
          mypy packages/core/src/agentic_kg/migration/ --ignore-missing-imports

      - name: Run the canonical-adapter tests (testcontainers Neo4j)
        # The WHOLE `migration` tree, deliberately, and restored after a
        # detour worth recording.
        #
        # This PR briefly scoped it to `migration/neo4j`, because the gate
        # below rejects ANY skip in this report and this PR's suite then had
        # one legitimate skip (an arm test waiting on PR #73), which failed a
        # gate that is not about it: "1 of 204 tests skipped".
        #
        # That was the wrong fix. PR #73's evaluation suite has no job of its
        # own -- `tests/migration/test_evaluation_suite_runs.py` documents that
        # it relies on *this* line running the whole tree -- so scoping it
        # silently stopped those tests running in CI at all. Worse, #73's guard
        # could not see it: its regex is `pytest\s+packages/core/tests/migration\b`
        # and `\b` matches at the `/` in `migration/neo4j`, so the assertion
        # stayed green while the fact it asserts became false. Reported
        # separately; not patched here.
        #
        # The skip that prompted the detour is gone -- #73 merged, that test
        # now runs, and the shadow suite's PERMITTED_SKIPS is empty by policy,
        # so every suite under this path is zero-skip and the gate's rule holds
        # for all of them. A suite that later needs a skip should get its own
        # job and gate, as `kgis-shadow-ingestion` has, rather than narrowing
        # this path again.
        run: |
          pytest packages/core/tests/migration \
            -v --tb=short \
            --junitxml=test-results/migration-adapter.xml

      - name: Assert the shared conformance suite actually ran
        # NOT a count. An earlier version of this step asserted only
        # "tests > 0 and skipped == 0"; deleting test_contract_conformance.py
        # left 53 other tests passing and the gate went green while the seven
        # shared contract tests were gone. suite_gate.py identifies them by
        # name - derived at runtime from kg_contracts, not transcribed - so a
        # deleted module, a class renamed out of collection, a skip, a failure,
        # or a partial run all go red. test_suite_gate.py proves each of those.
        if: always()
        run: |
          python packages/core/tests/migration/neo4j/suite_gate.py \
            test-results/migration-adapter.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-adapter-results
          path: test-results/

  kgis-shadow-ingestion:
    # The second call site for the opt-in `migration` extra, and the reason it
    # gets its own job rather than riding on `migration-canonical-adapter`:
    # this suite needs no Docker, no testcontainers and no database. It runs
    # the real KGIS ExtractionPipeline over the eight committed papers against
    # a replay client, in about twenty seconds. Folding it into the Neo4j job
    # would make a container failure look like an ingestion failure and would
    # tie a fast deterministic suite to a slow flaky one.
    #
    # BACKLOG KG-1 is why the gate step below exists: no general test job
    # installs the extra, so `conftest.py`'s importorskip turns this whole
    # suite into a silent no-op anywhere it is missing -- a green check over
    # nothing.
    name: KGIS shadow ingestion (replay corpus)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-migration-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (WITH the opt-in migration extra)
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e "./packages/core[migration]"

      - name: Assert the extra actually resolved
        # A skipped suite and a passing suite look identical in a green check.
        # Fail here rather than letting importorskip quietly empty the job.
        run: |
          python -c "import kgis, kg_contracts; print(kgis.__file__); print(kg_contracts.__file__)"

      - name: Assert no provider credential is visible
        # This path must never reach a live model. The suite asserts it too
        # (test_isolation), but asserting it before the suite runs means a
        # misconfigured runner fails with this message rather than with a
        # billing surprise.
        run: |
          python -c "
          from agentic_kg.migration.ingestion.replay import assert_no_live_provider
          assert_no_live_provider()
          print('no provider credential in the environment')
          "

      - name: Type-check the migration tree (mypy, WITH the extra resolved)
        # Deliberately NOT `|| true`. `mypy.ini` at the repo root keeps this
        # gate meaningful: this subpackage reuses the production segmenter, so
        # mypy follows into `agentic_kg.extraction` and its 55 pre-existing
        # errors; `follow_imports = silent` suppresses errors *inside* those
        # legacy modules while still type-checking the migration code that
        # calls them. Nothing under `agentic_kg.migration.*` is silenced.
        run: |
          pip install mypy types-PyYAML
          mypy packages/core/src/agentic_kg/migration/ --ignore-missing-imports

      - name: Run the shadow-ingestion suite
        run: |
          pytest packages/core/tests/migration/ingestion \
            -v --tb=short \
            --junitxml=test-results/kgis-shadow-ingestion.xml

      - name: Assert the suite actually ran
        # NOT a count of tests. The gate reads every `test_*` function defined
        # in the required modules and looks for each by name in the junit
        # report, so a whole-suite skip (the extra missing), a deleted module,
        # a class or module renamed out of collection, a failure, or a partial
        # run all go red. test_suite_gate.py proves each of those rejections.
        if: always()
        run: |
          python packages/core/tests/migration/ingestion/suite_gate.py \
            test-results/kgis-shadow-ingestion.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgis-shadow-ingestion-results
          path: test-results/

  integration-tests:
    name: Integration Tests (Neo4j)
    runs-on: ubuntu-latest
    needs: unit-tests
    # This job no longer consumes any secret -- it runs against a container it
    # starts itself -- so the fork restriction below is no longer about secret
    # availability. It is kept only to bound runner spend on fork PRs, and can
    # be dropped safely. Do NOT re-add staging credentials here to "fix" a fork
    # PR: the suite is designed to refuse a shared database.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run integration tests
        # No NEO4J_URI and no ownership flag. The conftest starts a throwaway
        # Neo4j container belonging to this run alone, and that -- starting the
        # container -- is the only thing that licenses the teardown sweep.
        # Adding NEO4J_URI here does not re-enable the shared-staging topology;
        # it makes the suite refuse to run.
        run: |
          pytest packages/core/tests/knowledge_graph/ \
            -m integration \
            -v --tb=short \
            --junitxml=test-results/integration-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  e2e-tests:
    name: E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: integration-tests
    # Only run on push to master (not PRs) to avoid excessive staging usage
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run E2E tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_NEO4J_URI: ${{ secrets.STAGING_NEO4J_URI }}
          STAGING_NEO4J_USER: neo4j
          STAGING_NEO4J_PASSWORD: ${{ secrets.STAGING_NEO4J_PASSWORD }}
        run: |
          pytest packages/core/tests/e2e/ \
            -m "e2e and not costly" \
            -v --tb=short \
            --junitxml=test-results/e2e-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
