# Integration Tests Workflow
# Runs integration tests against staging Neo4j instance
# Tests clean up after themselves using TEST_ prefix

name: Integration Tests

on:
  push:
    branches: [master, 'integration/**']
  pull_request:
    branches: [master, 'integration/**']
    paths:
      - 'packages/core/**'
      - 'pyproject.toml'

# A merge into a long-lived integration branch fires both the PR-close and the
# push event; without a group they race and burn double the runner minutes.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run unit tests
        run: |
          pytest packages/core/tests/ \
            --ignore=packages/core/tests/e2e \
            -m "not integration" \
            -v --tb=short \
            --junitxml=test-results/unit-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  migration-canonical-adapter:
    # The KGIS/KGCS `migration` extra is opt-in, so no other job installs it —
    # ADR-0004 recorded that as an accepted risk only "until PR 2", i.e. until
    # the extra gained a real call site. The Neo4j canonical adapter is that
    # call site, so this is the job that keeps its conformance suite honest:
    # without it the seven shared contract tests would silently skip forever.
    name: KGCS canonical adapter (contract suite)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-migration-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (WITH the opt-in migration extra)
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio "testcontainers[neo4j]" docker
          pip install -e "./packages/core[migration]"

      - name: Assert the extra actually resolved
        # A skipped suite and a passing suite look identical in a green check.
        # Fail loudly here rather than letting `importorskip` quietly turn this
        # whole job into a no-op.
        run: |
          python -c "import kg_contracts, kgcs; print(kg_contracts.__file__); print(kgcs.__file__)"

      - name: Run the canonical-adapter tests (testcontainers Neo4j)
        run: |
          pytest packages/core/tests/migration \
            -v --tb=short \
            --junitxml=test-results/migration-adapter.xml

      - name: Assert nothing was skipped
        # Same failure mode one layer up: Docker missing on the runner would
        # skip every test in the job and still report success.
        if: always()
        run: |
          python - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("test-results/migration-adapter.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"{total} tests, {skipped} skipped")
          if total == 0 or skipped:
              sys.exit("the canonical-adapter suite must run in full, not skip")
          EOF

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-adapter-results
          path: test-results/

  integration-tests:
    name: Integration Tests (Neo4j)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run if we have the secrets configured
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run integration tests
        env:
          NEO4J_URI: ${{ secrets.STAGING_NEO4J_URI }}
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ${{ secrets.STAGING_NEO4J_PASSWORD }}
        run: |
          pytest packages/core/tests/knowledge_graph/ \
            -m integration \
            -v --tb=short \
            --junitxml=test-results/integration-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  e2e-tests:
    name: E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: integration-tests
    # Only run on push to master (not PRs) to avoid excessive staging usage
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run E2E tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_NEO4J_URI: ${{ secrets.STAGING_NEO4J_URI }}
          STAGING_NEO4J_USER: neo4j
          STAGING_NEO4J_PASSWORD: ${{ secrets.STAGING_NEO4J_PASSWORD }}
        run: |
          pytest packages/core/tests/e2e/ \
            -m "e2e and not costly" \
            -v --tb=short \
            --junitxml=test-results/e2e-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
