# Integration Tests Workflow
# Runs integration tests against staging Neo4j instance
# Tests clean up after themselves using TEST_ prefix

name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - 'packages/core/**'
      - 'packages/api/**'
      - 'pyproject.toml'
  # Manual trigger. The E2E job otherwise only runs on push to master, so a
  # PR author had no way to exercise it before merge. Dispatch runs it against
  # the selected ref; set run_e2e=false for integration tests only.
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run E2E tests against staging'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run unit tests
        run: |
          pytest packages/core/tests/ \
            --ignore=packages/core/tests/e2e \
            -m "not integration" \
            -v --tb=short \
            --junitxml=test-results/unit-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  integration-tests:
    # ADR-0006: staging Neo4j is VPC-private; GitHub runners cannot reach it.
    # Run the integration-marked suite against an ephemeral testcontainers
    # Neo4j instead (the conftest already supports this when NEO4J_URI is
    # unset). No STAGING_NEO4J_* secret is consulted.
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Run on push, on manual dispatch (so a branch can be exercised before
    # merge), or on a PR from this repository. testcontainers needs no
    # Neo4j secrets, so there is no secret-configured gate here.
    if: |
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers[neo4j]
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run integration tests
        # No NEO4J_* env: the conftest starts an ephemeral Neo4j container.
        run: |
          pytest packages/core/tests/knowledge_graph/ \
            -m integration \
            -v --tb=short \
            --junitxml=test-results/integration-tests.xml

      - name: Run API read-model integration tests
        # Asserts canonical ProblemMention/ProblemConcept nodes ingested the
        # way the pipeline does are visible through /api/stats,
        # /api/problems, /api/problems/{id} and /api/topics/{id}/problems.
        run: |
          pytest packages/api/tests/integration/ \
            -m integration \
            -v --tb=short \
            --junitxml=test-results/api-read-model-integration-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  e2e-tests:
    # ADR-0006: staging Neo4j is VPC-private, so a GitHub-hosted runner can no
    # longer connect to it. This job therefore exercises (a) the deployed
    # public API — its /health assertion (`neo4j_connected`) is the end-to-end
    # proof that the private Neo4j path works from inside the VPC — and (b) the
    # core e2e tests that talk only to public live services (Semantic Scholar,
    # arXiv, the staging API). Core e2e tests that assert on graph contents need
    # direct DB access and are marked `requires_db`; they are deselected here
    # and run only in an environment that can reach the database (an in-VPC
    # Cloud Run Job, or locally via an IAP tunnel). No STAGING_NEO4J_* secret
    # is consulted anywhere in this repository.
    name: E2E Tests (Staging API + live sources)
    runs-on: ubuntu-latest
    needs: integration-tests
    # Only run on push to master (not PRs) to avoid excessive staging usage.
    # A manual workflow_dispatch may opt in (run_e2e, default true) so a
    # branch can be verified against staging before merge.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio httpx websockets
          pip install -e ./packages/core
          pip install -e ./packages/api

      - name: Run API E2E tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          # Fail loudly if a required secret is absent. conftest.py skips
          # when STAGING_API_URL is unset, which would let pytest exit 0 on an
          # all-skipped run and report a green job that asserted nothing about
          # staging (#80).
          : "${STAGING_API_URL:?STAGING_API_URL secret is not set}"

          pytest packages/api/tests/e2e/ \
            -m "e2e" \
            -v --tb=short \
            --junitxml=test-results/api-e2e-tests.xml

      - name: Run live-source E2E tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          # #80 finding 5: these tests hit the live Semantic Scholar API;
          # unauthenticated callers share one anonymous pool and flake on 429s.
          # Step-scoped, never job-wide (#80).
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          : "${STAGING_API_URL:?STAGING_API_URL secret is not set}"
          : "${SEMANTIC_SCHOLAR_API_KEY:?SEMANTIC_SCHOLAR_API_KEY secret is not set}"

          # `not requires_db` explicitly deselects the graph-content e2e tests
          # (test_kg_population.py) that need direct Neo4j access; they run only
          # in an environment that can reach the private database. `not costly`
          # excludes the LLM-cost tests, matching #103.
          pytest packages/core/tests/e2e/ \
            -m "e2e and not costly and not requires_db" \
            -v --tb=short \
            --junitxml=test-results/live-source-e2e-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
