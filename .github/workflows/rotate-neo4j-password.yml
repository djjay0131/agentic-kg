# Rotate the staging Neo4j credential (ADR-0006).
#
# Scheduled quarterly AND runnable on demand. The owner asked for rotation to
# be automated rather than remembered (2026-10-06); the schedule is the
# automation. Never triggered by push/PR. A single concurrency group means two
# rotations can never overlap: a queued run waits for the running one instead
# of cancelling it.
#
# Order of operations (ADR-0007: the password never leaves GCP):
#   1. point the in-VPC rotation Cloud Run Job at the current job image
#   2. run it. Under its own neo4j-rotator identity the Job GENERATES the new
#      password, stages it in NEO4J_PASSWORD_NEXT before touching Neo4j, runs
#      ALTER CURRENT USER SET PASSWORD, verifies a read with the new value,
#      and stores it as a new NEO4J_PASSWORD version. If a previous rotation
#      was interrupted after ALTER, it promotes the staged value first.
#   3. roll the API service and ingest Job onto the new version
#   4. verify the API can read the graph
#   5. only then disable the superseded NEO4J_PASSWORD versions and destroy the
#      transport copy (restoring the non-secret placeholder so `:latest`
#      resolves for the next run)
#
# This workflow never generates, reads, pipes or prints a password: it only
# triggers the Job and manages secret-version METADATA. On any failure it
# stops before disabling or destroying anything, so a re-run can recover:
#   - Job failed before ALTER: nothing changed; re-run.
#   - Job failed after ALTER: the staged value works; the next Job run
#     promotes it to NEO4J_PASSWORD first, then rotates again.
#   - Job succeeded, a later step failed: re-running rotates once more (safe).
# Between ALTER and the roll (seconds), the old API revision's NEW connections
# fail auth; existing pooled connections keep working. Run off-peak.

name: Rotate Neo4j Password

on:
  schedule:
    # 09:17 UTC on the 1st of Jan/Apr/Jul/Oct — quarterly. Off the hour to
    # avoid the runner stampede at :00.
    - cron: '17 9 1 */3 *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this rotation is being run (recorded in the summary)'
        required: false
        default: 'scheduled rotation'

# Never let two rotations run at once. A queued run waits rather than
# cancelling the in-flight one (the running rotation may be mid-cutover).
concurrency:
  group: rotate-neo4j-password
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: us-central1
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ENVIRONMENT: staging

jobs:
  rotate:
    name: Rotate staging Neo4j password
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Point the rotation Job at the current job image
        # Terraform ignores the Job image (deploys own it) and deploy-master
        # only re-points the ingest Job, so pin the rotation Job to the image
        # the ingest Job runs. The command is the in-GCP entrypoint module: an
        # image that predates it fails to start (ModuleNotFoundError) before
        # touching Neo4j, rather than running the legacy rotation.
        run: |
          set -euo pipefail
          IMAGE="$(gcloud run jobs describe "agentic-kg-ingest-$ENVIRONMENT" \
            --region="$REGION" --project="$PROJECT_ID" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          gcloud run jobs update "agentic-kg-rotate-neo4j-$ENVIRONMENT" \
            --region="$REGION" --project="$PROJECT_ID" --image="$IMAGE" \
            --command=python --args=-m,agentic_kg.rotate_password_gcp

      - name: Run the in-VPC rotation job (generates and stores the password)
        run: |
          gcloud run jobs execute "agentic-kg-rotate-neo4j-$ENVIRONMENT" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --wait

      - name: Roll Cloud Run onto the new secret version
        # `:latest` alone is not a config change, so also stamp a label to
        # force a fresh revision that resolves the new version.
        run: |
          gcloud run services update "agentic-kg-api-$ENVIRONMENT" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --update-secrets=NEO4J_PASSWORD=NEO4J_PASSWORD:latest \
            --update-labels=neo4j-password-rotated=${{ github.run_id }}
          gcloud run jobs update "agentic-kg-ingest-$ENVIRONMENT" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --update-secrets=NEO4J_PASSWORD=NEO4J_PASSWORD:latest \
            --update-labels=neo4j-password-rotated=${{ github.run_id }}

      - name: Verify the API reads the graph on the new credential
        run: |
          set -euo pipefail
          API_URL="$(gcloud run services describe "agentic-kg-api-$ENVIRONMENT" \
            --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')"
          for _ in $(seq 1 20); do
            if curl -fsS "$API_URL/health" | python3 -c \
              'import json,sys; sys.exit(0 if json.load(sys.stdin).get("neo4j_connected") is True else 1)'; then
              echo "API reports Neo4j connected after rotation."
              exit 0
            fi
            sleep 6
          done
          echo "::error::API did not report neo4j_connected after rotation"
          exit 1

      - name: Disable the superseded secret versions
        run: |
          set -euo pipefail
          gcloud secrets versions list "NEO4J_PASSWORD" \
            --project="$PROJECT_ID" --filter='state=ENABLED' \
            --sort-by='~createTime' --format='value(name.basename())' \
          | tail -n +2 \
          | while read -r version; do
              gcloud secrets versions disable "$version" \
                --secret="NEO4J_PASSWORD" --project="$PROJECT_ID"
              echo "Disabled superseded NEO4J_PASSWORD version $version."
            done

      - name: Destroy the transport copy (placeholder first)
        # The Job reads NEO4J_PASSWORD_NEXT:latest at start-up, so a
        # non-secret placeholder (the same seed Terraform writes; the Job
        # treats it as "nothing staged") is added FIRST, then every older
        # enabled version is destroyed. If the add fails nothing is destroyed,
        # so the Job always remains startable.
        run: |
          set -euo pipefail
          printf '%s' 'unset-seed-not-a-password' | gcloud secrets versions add \
            "NEO4J_PASSWORD_NEXT" --project="$PROJECT_ID" --data-file=- >/dev/null
          echo "Added the NEO4J_PASSWORD_NEXT placeholder."
          gcloud secrets versions list "NEO4J_PASSWORD_NEXT" \
            --project="$PROJECT_ID" --filter='state=ENABLED' \
            --sort-by='~createTime' --format='value(name.basename())' \
          | tail -n +2 \
          | while read -r version; do
              gcloud secrets versions destroy "$version" \
                --secret="NEO4J_PASSWORD_NEXT" --project="$PROJECT_ID" --quiet
              echo "Destroyed transport version $version."
            done

      - name: Rotation summary
        env:
          REASON: ${{ github.event.inputs.reason }}
        run: |
          echo "## Neo4j password rotation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`$ENVIRONMENT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: complete" >> "$GITHUB_STEP_SUMMARY"
