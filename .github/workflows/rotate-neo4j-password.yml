# Rotate the staging Neo4j credential (ADR-0006).
#
# workflow_dispatch ONLY. Never triggered by push/PR/schedule: a credential
# rotation is a deliberate operator action.
#
# Order of operations (all-or-nothing safety):
#   1. generate a strong password and mask it immediately
#   2. stage it in the NEO4J_PASSWORD_NEXT transport secret
#   3. run the in-VPC rotation Cloud Run Job (Neo4j is private after
#      ADR-0006) which performs ALTER CURRENT USER SET PASSWORD and
#      verifies a read with the new credential
#   4. promote the value to NEO4J_PASSWORD (a new Secret Manager version)
#   5. roll the API service and ingest Job onto it
#   6. verify the API can read the graph
#   7. only then disable the superseded secret version
#
# The password is never printed, never written to a file, and never placed
# in GITHUB_OUTPUT / GITHUB_ENV / the step summary.

name: Rotate Neo4j Password

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this rotation is being run (recorded in the summary)'
        required: false
        default: 'scheduled rotation'

permissions:
  contents: read

env:
  REGION: us-central1
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ENVIRONMENT: staging

jobs:
  rotate:
    name: Rotate staging Neo4j password
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate a strong password and stage it
        # The generated value lives only in this step's shell. It is masked
        # before it can reach a log, piped straight into Secret Manager, and
        # unset immediately afterwards.
        run: |
          set -euo pipefail
          NEW_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$NEW_PASSWORD"
          printf '%s' "$NEW_PASSWORD" | gcloud secrets versions add \
            "NEO4J_PASSWORD_NEXT" \
            --project="$PROJECT_ID" \
            --data-file=- >/dev/null
          unset NEW_PASSWORD
          echo "Staged a new password version in NEO4J_PASSWORD_NEXT."

      - name: Run the in-VPC rotation job
        run: |
          gcloud run jobs execute "agentic-kg-rotate-neo4j-$ENVIRONMENT" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --wait

      - name: Promote the verified password to NEO4J_PASSWORD
        # Streamed secret-to-secret: the value never enters a shell variable.
        run: |
          gcloud secrets versions access latest \
            --secret="NEO4J_PASSWORD_NEXT" \
            --project="$PROJECT_ID" \
          | gcloud secrets versions add "NEO4J_PASSWORD" \
            --project="$PROJECT_ID" \
            --data-file=-

      - name: Roll Cloud Run onto the new secret version
        # `:latest` alone is not a config change, so also stamp a label to
        # force a fresh revision that resolves the new version.
        run: |
          gcloud run services update "agentic-kg-api-$ENVIRONMENT" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --update-secrets=NEO4J_PASSWORD=NEO4J_PASSWORD:latest \
            --update-labels=neo4j-password-rotated=${{ github.run_id }}
          gcloud run jobs update "agentic-kg-ingest-$ENVIRONMENT" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --update-secrets=NEO4J_PASSWORD=NEO4J_PASSWORD:latest \
            --update-labels=neo4j-password-rotated=${{ github.run_id }}

      - name: Verify the API reads the graph on the new credential
        run: |
          set -euo pipefail
          API_URL="$(gcloud run services describe "agentic-kg-api-$ENVIRONMENT" \
            --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')"
          for _ in $(seq 1 20); do
            if curl -fsS "$API_URL/health" | python3 -c \
              'import json,sys; sys.exit(0 if json.load(sys.stdin).get("neo4j_connected") is True else 1)'; then
              echo "API reports Neo4j connected after rotation."
              exit 0
            fi
            sleep 6
          done
          echo "::error::API did not report neo4j_connected after rotation"
          exit 1

      - name: Disable the superseded secret version
        run: |
          set -euo pipefail
          PREVIOUS="$(gcloud secrets versions list "NEO4J_PASSWORD" \
            --project="$PROJECT_ID" --filter='state=ENABLED' \
            --sort-by='~createTime' --format='value(name)' | sed -n '2p')"
          if [ -n "$PREVIOUS" ]; then
            gcloud secrets versions disable "$PREVIOUS" \
              --secret="NEO4J_PASSWORD" --project="$PROJECT_ID"
            echo "Disabled superseded NEO4J_PASSWORD version $PREVIOUS."
          fi

      - name: Destroy the transport version
        run: |
          set -euo pipefail
          NEXT="$(gcloud secrets versions list "NEO4J_PASSWORD_NEXT" \
            --project="$PROJECT_ID" --filter='state=ENABLED' \
            --sort-by='~createTime' --format='value(name)' | head -n1)"
          if [ -n "$NEXT" ]; then
            gcloud secrets versions destroy "$NEXT" \
              --secret="NEO4J_PASSWORD_NEXT" --project="$PROJECT_ID" --quiet
            echo "Destroyed transport version $NEXT."
          fi

      - name: Rotation summary
        env:
          REASON: ${{ github.event.inputs.reason }}
        run: |
          echo "## Neo4j password rotation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`$ENVIRONMENT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: complete" >> "$GITHUB_STEP_SUMMARY"
