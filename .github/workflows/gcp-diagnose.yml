# Read-only GCP diagnostics for staging. Never mutates anything.
# Used to find what keeps redeploying agentic-kg-api-staging outside Terraform.
name: GCP Diagnose (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: us-central1
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ---- Nightly pipeline diagnostics (read-only) -----------------------
      # Never prints secret values or environment values: only execution
      # metadata, scheduler state, job execution status and log fields.
      - name: Nightly workflow executions (last 5, with error)
        run: |
          gcloud workflows executions list agentic-kg-nightly-staging \
            --location="$REGION" --project="$PROJECT_ID" --limit=5 \
            --format='table(name.basename(),state,startTime,endTime,error.payload)' || true
          for execution in $(gcloud workflows executions list agentic-kg-nightly-staging \
              --location="$REGION" --project="$PROJECT_ID" --limit=5 \
              --format='value(name)'); do
            echo "== ${execution##*/}"
            gcloud workflows executions describe "${execution##*/}" \
              --workflow=agentic-kg-nightly-staging \
              --location="$REGION" --project="$PROJECT_ID" \
              --format='yaml(name,state,startTime,endTime,error,status)' || true
          done

      - name: Nightly Cloud Scheduler job
        run: |
          gcloud scheduler jobs describe agentic-kg-nightly-staging \
            --location="$REGION" --project="$PROJECT_ID" \
            --format='yaml(name,state,schedule,timeZone,lastAttemptTime,status,httpTarget.uri)' || true

      - name: Nightly-related Cloud Run Job executions (last 5 each)
        run: |
          for job in agentic-kg-nightly-staging agentic-kg-ingest-staging agentic-kg-adviser-staging; do
            echo "== ${job} executions"
            gcloud run jobs executions list \
              --job="$job" --region="$REGION" --project="$PROJECT_ID" --limit=5 \
              --format='yaml(metadata.name,metadata.creationTimestamp,status)' || true
          done

      - name: Recent ERROR and structured logs for nightly Jobs
        run: |
          for job in agentic-kg-nightly-staging agentic-kg-ingest-staging agentic-kg-adviser-staging; do
            echo "== ${job} recent ERROR / structured logs"
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${job}\" AND (severity>=ERROR OR jsonPayload.event:*)" \
              --project="$PROJECT_ID" --freshness=7d --limit=50 \
              --format='table(timestamp,severity,jsonPayload.event,jsonPayload.status,jsonPayload.run_id,jsonPayload.message,textPayload)' || true
          done

      # ---- Experiment sandbox diagnostics (read-only) ---------------------
      # The experiment Job runs generated code on a dedicated VPC and is
      # invisible from a terminal. This section prints the definition, the
      # last executions, the last log lines and the prefix-scoped bucket IAM
      # without printing any env value or object contents.
      - name: "Experiment sandbox: Job definition and recent executions"
        run: |
          COORDS="$(gcloud run services describe agentic-kg-api-staging \
              --region="$REGION" --project="$PROJECT_ID" --format=json | python3 -c 'import json,sys; d=json.load(sys.stdin); c=d["spec"]["template"]["spec"]["containers"][0]; env={e["name"]:e.get("value","") for e in (c.get("env") or [])}; print(env.get("EXPERIMENT_GCS_BUCKET",""), env.get("EXPERIMENT_GCS_PREFIX","staging"), env.get("EXPERIMENT_JOB_NAME","agentic-kg-experiment-staging"))')"
          read -r BUCKET PREFIX EXP_JOB <<<"$COORDS"
          EXP_JOB="${EXP_JOB:-agentic-kg-experiment-staging}"
          echo "experiment bucket=${BUCKET} prefix=${PREFIX} job=${EXP_JOB}"
          echo "== ${EXP_JOB} definition summary (no env values) =="
          echo "image: $(gcloud run jobs describe "$EXP_JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.containers[0].image)' 2>/dev/null || true)"
          echo "command: $(gcloud run jobs describe "$EXP_JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.containers[0].command)' 2>/dev/null || true)"
          echo "args: $(gcloud run jobs describe "$EXP_JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.containers[0].args)' 2>/dev/null || true)"
          echo "timeout: $(gcloud run jobs describe "$EXP_JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.timeout)' 2>/dev/null || true)"
          echo "maxRetries: $(gcloud run jobs describe "$EXP_JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.maxRetries)' 2>/dev/null || true)"
          echo "serviceAccount: $(gcloud run jobs describe "$EXP_JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.serviceAccount)' 2>/dev/null || true)"
          echo "vpcAccess: $(gcloud run jobs describe "$EXP_JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.vpcAccess)' 2>/dev/null || true)"
          echo "resources: $(gcloud run jobs describe "$EXP_JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.containers[0].resources.limits)' 2>/dev/null || true)"
          echo "envNames: $(gcloud run jobs describe "$EXP_JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.containers[0].env[].name)' 2>/dev/null || true)"
          echo "== ${EXP_JOB} last 5 executions =="
          gcloud run jobs executions list --job="$EXP_JOB" --region="$REGION" \
            --project="$PROJECT_ID" --limit=5 \
            --format='yaml(metadata.name,metadata.creationTimestamp,status.startTime,status.completionTime,status.succeededCount,status.failedCount,status.cancelledCount,status.conditions)' || true
          for execution in $(gcloud run jobs executions list --job="$EXP_JOB" \
              --region="$REGION" --project="$PROJECT_ID" --limit=5 \
              --format='value(name)'); do
            echo "== ${execution} logs (last 100) =="
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${EXP_JOB}\" AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\"" \
              --project="$PROJECT_ID" --limit=100 --order=desc \
              --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
          done

      - name: "Experiment sandbox: bucket IAM for the experiment prefix"
        run: |
          read -r BUCKET PREFIX <<<"$(gcloud run services describe agentic-kg-api-staging \
              --region="$REGION" --project="$PROJECT_ID" --format=json | python3 -c 'import json,sys; d=json.load(sys.stdin); c=d["spec"]["template"]["spec"]["containers"][0]; env={e["name"]:e.get("value","") for e in (c.get("env") or [])}; print(env.get("EXPERIMENT_GCS_BUCKET",""), env.get("EXPERIMENT_GCS_PREFIX","staging"))')"
          if [ -z "$BUCKET" ]; then
            echo "no EXPERIMENT_GCS_BUCKET configured on the API; skipping bucket IAM"
            exit 0
          fi
          # Members and roles for bindings scoped to this prefix. No object
          # contents and no non-prefix bucket bindings are printed.
          gcloud storage buckets get-iam-policy "gs://${BUCKET}" --project="$PROJECT_ID" \
            --format=json | PREFIX="$PREFIX" python3 -c 'import json,os,sys; p=json.load(sys.stdin); pre=os.environ["PREFIX"].strip("/")+"/"; rows=[(b.get("role"),b.get("members"),(b.get("condition") or {}).get("title"),(b.get("condition") or {}).get("expression","")) for b in p.get("bindings",[]) if "objects/" in ((b.get("condition") or {}).get("expression","")) and pre in ((b.get("condition") or {}).get("expression",""))]; [print("role:",r,"members:",m,"condition:",t,"|",e) for r,m,t,e in rows] or print("no prefix-scoped bindings for",pre)'

      - name: "Experiment sandbox: ingest Job definition summary"
        run: |
          for JOB in agentic-kg-ingest-staging agentic-kg-llm-check-staging; do
            echo "== ${JOB} definition summary (no env values) =="
            echo "image: $(gcloud run jobs describe "$JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.containers[0].image)' 2>/dev/null || true)"
            echo "command: $(gcloud run jobs describe "$JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.containers[0].command)' 2>/dev/null || true)"
            echo "args: $(gcloud run jobs describe "$JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.containers[0].args)' 2>/dev/null || true)"
            echo "timeout: $(gcloud run jobs describe "$JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.timeout)' 2>/dev/null || true)"
            echo "maxRetries: $(gcloud run jobs describe "$JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.maxRetries)' 2>/dev/null || true)"
            echo "serviceAccount: $(gcloud run jobs describe "$JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.serviceAccount)' 2>/dev/null || true)"
            echo "vpcAccess: $(gcloud run jobs describe "$JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.vpcAccess)' 2>/dev/null || true)"
            echo "envNames: $(gcloud run jobs describe "$JOB" --region="$REGION" --project="$PROJECT_ID" --format='value(template.template.containers[0].env[].name)' 2>/dev/null || true)"
          done

      - name: Cloud Build triggers
        run: |
          gcloud builds triggers list --project="$PROJECT_ID" --region=global \
            --format='table(name,disabled,github.push.branch,filename,createTime)' || true
          gcloud builds triggers list --project="$PROJECT_ID" --region="$REGION" \
            --format='table(name,disabled,github.push.branch,filename,createTime)' || true

      - name: Recent Cloud Builds
        run: |
          gcloud builds list --project="$PROJECT_ID" --limit=15 \
            --format='table(id.slice(0:8),createTime,status,substitutions.TRIGGER_NAME,substitutions.BRANCH_NAME)' || true

      - name: API revisions (who created each)
        run: |
          gcloud run revisions list --service=agentic-kg-api-staging --region="$REGION" \
            --project="$PROJECT_ID" --limit=12 \
            --format='table(metadata.name,metadata.creationTimestamp,metadata.annotations."serving.knative.dev/creator",metadata.annotations."run.googleapis.com/client-name",metadata.labels.commit)'

      - name: Env var NAMES per recent API revision (no values)
        run: |
          for r in $(gcloud run revisions list --service=agentic-kg-api-staging --region="$REGION" \
              --project="$PROJECT_ID" --limit=6 --format='value(metadata.name)'); do
            echo "== $r"
            gcloud run revisions describe "$r" --region="$REGION" --project="$PROJECT_ID" \
              --format='value(spec.containers[0].env[].name)' | tr ';' '\n' | sort | tr '\n' ' '
            echo
          done

      - name: Audit log - who changed the API service (last 2 days)
        run: |
          gcloud logging read \
            'protoPayload.serviceName="run.googleapis.com" AND protoPayload.resourceName:"services/agentic-kg-api-staging" AND protoPayload.methodName:("ReplaceService" OR "UpdateService" OR "CreateService")' \
            --project="$PROJECT_ID" --freshness=2d --limit=20 \
            --format='table(timestamp,protoPayload.methodName,protoPayload.authenticationInfo.principalEmail,protoPayload.requestMetadata.callerSuppliedUserAgent.slice(0:60))' || true
