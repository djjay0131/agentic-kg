# Read-only GCP diagnostics for staging. Never mutates anything.
# Used to find what keeps redeploying agentic-kg-api-staging outside Terraform.
name: GCP Diagnose (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: us-central1
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ---- Nightly pipeline diagnostics (read-only) -----------------------
      # Never prints secret values or environment values: only execution
      # metadata, scheduler state, job execution status and log fields.
      - name: Nightly workflow executions (last 5, with error)
        run: |
          gcloud workflows executions list agentic-kg-nightly-staging \
            --location="$REGION" --project="$PROJECT_ID" --limit=5 \
            --format='table(name.basename(),state,startTime,endTime,error.payload)' || true
          for execution in $(gcloud workflows executions list agentic-kg-nightly-staging \
              --location="$REGION" --project="$PROJECT_ID" --limit=5 \
              --format='value(name)'); do
            echo "== ${execution##*/}"
            gcloud workflows executions describe "${execution##*/}" \
              --workflow=agentic-kg-nightly-staging \
              --location="$REGION" --project="$PROJECT_ID" \
              --format='yaml(name,state,startTime,endTime,error,status)' || true
          done

      - name: Nightly Cloud Scheduler job
        run: |
          gcloud scheduler jobs describe agentic-kg-nightly-staging \
            --location="$REGION" --project="$PROJECT_ID" \
            --format='yaml(name,state,schedule,timeZone,lastAttemptTime,status,httpTarget.uri)' || true

      - name: Nightly-related Cloud Run Job executions (last 5 each)
        run: |
          for job in agentic-kg-nightly-staging agentic-kg-ingest-staging agentic-kg-adviser-staging; do
            echo "== ${job} executions"
            gcloud run jobs executions list \
              --job="$job" --region="$REGION" --project="$PROJECT_ID" --limit=5 \
              --format='yaml(metadata.name,metadata.creationTimestamp,status)' || true
          done

      - name: Recent ERROR and structured logs for nightly Jobs
        run: |
          for job in agentic-kg-nightly-staging agentic-kg-ingest-staging agentic-kg-adviser-staging; do
            echo "== ${job} recent ERROR / structured logs"
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${job}\" AND (severity>=ERROR OR jsonPayload.event:*)" \
              --project="$PROJECT_ID" --freshness=7d --limit=50 \
              --format='table(timestamp,severity,jsonPayload.event,jsonPayload.status,jsonPayload.run_id,jsonPayload.message,textPayload)' || true
          done

      - name: Cloud Build triggers
        run: |
          gcloud builds triggers list --project="$PROJECT_ID" --region=global \
            --format='table(name,disabled,github.push.branch,filename,createTime)' || true
          gcloud builds triggers list --project="$PROJECT_ID" --region="$REGION" \
            --format='table(name,disabled,github.push.branch,filename,createTime)' || true

      - name: Recent Cloud Builds
        run: |
          gcloud builds list --project="$PROJECT_ID" --limit=15 \
            --format='table(id.slice(0:8),createTime,status,substitutions.TRIGGER_NAME,substitutions.BRANCH_NAME)' || true

      - name: API revisions (who created each)
        run: |
          gcloud run revisions list --service=agentic-kg-api-staging --region="$REGION" \
            --project="$PROJECT_ID" --limit=12 \
            --format='table(metadata.name,metadata.creationTimestamp,metadata.annotations."serving.knative.dev/creator",metadata.annotations."run.googleapis.com/client-name",metadata.labels.commit)'

      - name: Env var NAMES per recent API revision (no values)
        run: |
          for r in $(gcloud run revisions list --service=agentic-kg-api-staging --region="$REGION" \
              --project="$PROJECT_ID" --limit=6 --format='value(metadata.name)'); do
            echo "== $r"
            gcloud run revisions describe "$r" --region="$REGION" --project="$PROJECT_ID" \
              --format='value(spec.containers[0].env[].name)' | tr ';' '\n' | sort | tr '\n' ' '
            echo
          done

      - name: Audit log - who changed the API service (last 2 days)
        run: |
          gcloud logging read \
            'protoPayload.serviceName="run.googleapis.com" AND protoPayload.resourceName:"services/agentic-kg-api-staging" AND protoPayload.methodName:("ReplaceService" OR "UpdateService" OR "CreateService")' \
            --project="$PROJECT_ID" --freshness=2d --limit=20 \
            --format='table(timestamp,protoPayload.methodName,protoPayload.authenticationInfo.principalEmail,protoPayload.requestMetadata.callerSuppliedUserAgent.slice(0:60))' || true
