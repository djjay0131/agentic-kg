name: RQ1 Evaluation

# Runs the RQ1 extraction-reliability harness against the frozen 8-paper gold
# fixture and the frozen legacy importer output. No LLM call, no external
# service, no secrets: the only inputs are committed JSONL files.
#
# The report is uploaded as an artifact so a reviewer can inspect precision,
# recall, F1, section slices, agreement and error buckets without rerunning it.
# This job is additive to the required `test (3.12)` check; it does not modify
# branch protection or make the harness a merge gate.

on:
  pull_request:
    branches: [master, 'integration/**']
  push:
    branches: [master, 'integration/**']

permissions:
  contents: read

concurrency:
  group: rq1-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rq1-eval:
    name: RQ1 evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core package (default install, no migration extra)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install ./packages/core

      - name: Run RQ1 harness tests
        run: pytest packages/core/tests/evaluation -q

      - name: Run RQ1 harness on the frozen fixture
        run: |
          python -m agentic_kg.evaluation.rq1 \
            --gold packages/core/tests/evaluation/fixtures/rq1/gold.jsonl \
            --pred packages/core/tests/evaluation/fixtures/rq1/predictions.jsonl \
            --corpus packages/core/tests/evaluation/fixtures/rq1/corpus.json \
            --bootstrap 500 \
            --out rq1-report.json \
            --markdown rq1-report.md

      - name: Upload RQ1 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rq1-report
          path: |
            rq1-report.json
            rq1-report.md
          if-no-files-found: warn
