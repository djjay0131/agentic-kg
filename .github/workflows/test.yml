name: Run Tests

on:
  pull_request:
    branches: [master, main, 'integration/**']
  push:
    branches: [master, main, 'integration/**']

# A merge into a long-lived integration branch fires both the PR-close and the
# push event; without a group they race and burn double the runner minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Codecov authenticates with GitHub's OIDC token instead of a stored
  # CODECOV_TOKEN (ADR-0007 rule 1: keyless first).
  id-token: write

env:
  # Ephemeral runners: no reaper needed, and its image pull hits Docker Hub limits.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install ./packages/core
          pip install ./packages/api

      - name: Run tests with coverage
        run: |
          pytest packages/core/tests \
            --ignore=packages/core/tests/e2e \
            -v --cov=agentic_kg --cov-report=term-missing --cov-report=xml

      - name: Run API tests
        # packages/api/tests is a separate `tests` package from
        # packages/core/tests, so it needs its own invocation (one pytest run
        # over both raises ImportPathMismatchError). Previously no workflow
        # ran it at all, including the #76 404 regression tests.
        run: |
          pytest packages/api/tests -v --tb=short

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          use_oidc: true

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
