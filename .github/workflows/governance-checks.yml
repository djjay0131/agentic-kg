name: Governance Checks

# Runs the canonical agentic-governance ruleset (delta / ADR / L0-allowlist /
# doc-link checks) against this repo on every PR and on pushes to master.
#
# The checker script lives in the *public* agentic-governance repo, not here,
# so this job fetches it pinned to a commit SHA for reproducibility (keep the
# SHA in sync with the governance version pinned in llm/governance/governance-delta.md).
# It is cloned OUTSIDE the workspace ($RUNNER_TEMP) so the script's own file
# scan (rooted at `git rev-parse --show-toplevel`) does not walk into it.
#
# `--base` must be the PR's REAL base, not always master. The script defaults to
# origin/main; this repo's default branch is master, and migration PRs target
# `integration/**`. Diffing an integration PR against master would score it on
# every commit the integration branch carries, not on what the PR changes — a
# growing error as that branch diverges. `--layout` asserts that every path declared
# in llm/governance/governance-delta.md §Repository Layout exists, that every
# canonical slot directory holding content is declared (added in canon v0.8.0),
# and that no source-of-truth document sits under the declared artifacts directory.

on:
  pull_request:
    branches: [master, 'integration/**']
  push:
    branches: [master, 'integration/**']

permissions:
  contents: read

# A merge into a long-lived integration branch fires both the PR-close and the
# push event; without a group they race and burn double the runner minutes.
concurrency:
  group: governance-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-checks:
    name: Governance Checks
    runs-on: ubuntu-latest
    env:
      GOVERNANCE_REPO: djjay0131/agentic-governance
      # agentic-governance v0.9.0 (VERSION 0.9.0). Bump alongside the version
      # pinned in llm/governance/governance-delta.md when adopting a newer ruleset.
      GOVERNANCE_REF: 851a50a0692d4409cbd255e3b3be111d863ae264
    steps:
      - name: Check out repo (full history so origin/master exists for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and fetch the base ref
        id: base
        run: |
          # pull_request -> the branch being merged into; push -> master.
          BASE="${{ github.base_ref }}"
          BASE="${BASE:-master}"
          git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          echo "ref=origin/${BASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch pinned canonical governance ruleset (outside the workspace)
        run: |
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${GOVERNANCE_REPO}.git" "${RUNNER_TEMP}/governance-src"
          git -C "${RUNNER_TEMP}/governance-src" checkout --quiet "${GOVERNANCE_REF}"

      - name: Run governance checks
        run: node "${RUNNER_TEMP}/governance-src/plugin/scripts/governance-checks.mjs" --base ${{ steps.base.outputs.ref }} --layout
