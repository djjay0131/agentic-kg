# mypy configuration.
#
# The repo has two mypy invocations and they are not equally meaningful:
#
# * `code-review.yml` runs it over everything and swallows the exit code
#   (`|| true`), so it reports and enforces nothing;
# * `integration-tests.yml`'s migration jobs run it over
#   `packages/core/src/agentic_kg/migration/` WITHOUT `|| true`, with the
#   `migration` extra installed so `kg_contracts` (which ships `py.typed`)
#   really is checked rather than degrading to `Any`.
#
# The second is a real gate, and this file exists to keep it one.
#
# `migration/ingestion/` reuses the production segmenter
# (`agentic_kg.extraction.section_segmenter`) rather than reimplementing it,
# which is the right call and has one side effect: mypy follows that import
# into `agentic_kg.extraction`, and from there into `knowledge_graph` and
# `data_acquisition`. Those packages carry 55 pre-existing errors — almost all
# `Optional` singletons dereferenced without a None check — and none of them is
# about the migration code. Without the overrides below, adopting the segmenter
# would turn a passing gate red for reasons unrelated to the change, and the
# only cheap way out would be to stop reusing it.
#
# `follow_imports = silent` is the narrow fix and is deliberately not `skip`:
# mypy still reads those modules and still uses their types to check the
# migration code that calls them. It only suppresses errors reported *inside*
# them. So `SectionChunker`'s use of `Section.start_char` is type-checked
# exactly as before; `batch.py`'s own unrelated debt is not reported here.
#
# This silences nothing in `agentic_kg.migration.*`, which is the tree the gate
# is about. Paying down the legacy debt is a separate piece of work; when it is
# paid, delete the matching section below and the gate widens on its own.

[mypy]
ignore_missing_imports = True

[mypy-agentic_kg.extraction.*]
follow_imports = silent

[mypy-agentic_kg.knowledge_graph.*]
follow_imports = silent

[mypy-agentic_kg.data_acquisition.*]
follow_imports = silent
